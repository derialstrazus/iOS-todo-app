<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Todo">
<meta name="theme-color" content="#0d0a06" id="theme-color">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Todo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  /* ------------------------------------------------------------------
     Palette. Two modes: default/Home is warm gold, Work is cold steel.
     `data-mode` is stamped on <html> from viewMode, so clearing the mode
     falls back to gold. Legacy token names (--bg, --surface, --accent …)
     are kept as aliases so rules that haven't been restyled still resolve.
     ------------------------------------------------------------------ */
  :root {
    --acc: #d9a441;
    --acc-hi: #f5c869;
    --acc-dim: #7a5f2c;
    --acc-wash: rgba(217,164,65,0.10);
    --acc-glow: rgba(217,164,65,0.45);
    --on-acc: #1d1408;

    --bg-a: #171006;
    --bg-b: #0d0a06;
    --bg-c: #060504;
    --sky: rgba(245,200,105,0.20);
    --ray: rgba(245,225,180,0.045);

    --pan-a: #241b0d;
    --pan-b: #1a1409;

    --ink: #ece0c6;
    --ink-2: #93825f;

    --edge: #3a2c14;
    --hatch: rgba(217,164,65,0.05);
    --row-line: rgba(217,164,65,0.13);

    --tab-a: #312613;
    --tab-b: #1e1709;

    --bar-a: rgba(72,55,25,0.85);
    --bar-b: rgba(48,37,17,0.92);
    --bar-line: rgba(217,164,65,0.26);

    --alert: #c9552f;

    /* Category tags carry the two mode hues as FIXED values — deliberately not
       remapped under [data-mode], so a Home-tagged category reads gold and a
       Work-tagged one reads steel whichever mode is currently active. */
    --home: #d9a441;
    --work: #a9bdcc;

    /* legacy aliases */
    --bg: var(--bg-b);
    --surface: #1c1509;
    --surface-2: var(--pan-a);
    --text: var(--ink);
    --muted: var(--ink-2);
    --accent: var(--acc);
    --danger: var(--alert);
  }

  :root[data-mode="work"] {
    --acc: #a9bdcc;
    --acc-hi: #e0edf5;
    --acc-dim: #4e606d;
    --acc-wash: rgba(169,189,204,0.12);
    --acc-glow: rgba(169,189,204,0.40);
    --on-acc: #0b1116;

    --bg-a: #0e1215;
    --bg-b: #090c0f;
    --bg-c: #050708;
    --sky: rgba(210,228,240,0.12);
    --ray: rgba(225,238,248,0.05);

    --pan-a: #1b2127;
    --pan-b: #141920;

    --ink: #e0e8ee;
    --ink-2: #7e8c96;

    --edge: #2c353d;
    --hatch: rgba(169,189,204,0.045);
    --row-line: rgba(169,189,204,0.13);

    --tab-a: #232b33;
    --tab-b: #151a20;

    --bar-a: rgba(48,58,68,0.85);
    --bar-b: rgba(32,40,48,0.92);
    --bar-line: rgba(169,189,204,0.24);

    /* warmer red would fight the cold ground; lift it toward coral */
    --alert: #e0765a;

    --surface: #12171c;
  }

  /* The archive screen's own palette: black and white. The two todos palettes are
     a warm or cold accent over a tinted ground; this one drains the ground to
     true black and takes white as the accent, so the only colour left anywhere on
     the screen is the --work/--home hue the group bars carry. Those two stay fixed
     here as everywhere else, which is exactly what makes the grouping legible
     against a neutral field. --alert is deliberately NOT remapped: red still has
     to read as danger in the menu behind this screen. */
  :root[data-mode="mono"] {
    --acc: #ffffff;
    --acc-hi: #ffffff;
    --acc-dim: #8d8d8d;
    --acc-wash: rgba(255,255,255,0.10);
    --acc-glow: rgba(255,255,255,0.30);
    --on-acc: #000000;

    /* Flat black, not a three-stop gradient. The sky glow and the god-rays are
       both accent-derived washes; a white one reads as a smudge rather than
       light, so they go transparent instead of turning grey. */
    --bg-a: #000000;
    --bg-b: #000000;
    --bg-c: #000000;
    --sky: transparent;
    --ray: transparent;

    --pan-a: #171717;
    --pan-b: #101010;

    --ink: #f2f2f2;
    --ink-2: #8f8f8f;

    --edge: #3a3a3a;
    --hatch: rgba(255,255,255,0.045);
    --row-line: rgba(255,255,255,0.13);

    --tab-a: #2a2a2a;
    --tab-b: #161616;

    --bar-a: rgba(66,66,66,0.85);
    --bar-b: rgba(42,42,42,0.92);
    --bar-line: rgba(255,255,255,0.24);

    --surface: #0f0f0f;
  }

  html, body {
    background: var(--bg-b);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    height: 100%;
    overscroll-behavior: none;
    /* iOS Safari can still fire its built-in double-tap-to-zoom gesture even with
       the viewport meta's user-scalable=no, which leaves layout/scroll metrics
       off afterward (the extra gap at the bottom of the list). touch-action:
       manipulation tells the browser to skip that gesture entirely. */
    touch-action: manipulation;
  }
  body {
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    /* position: fixed + inset: 0 instead of height: 100% — pins body to the actual
       visual viewport. touch-action: manipulation above wasn't enough on its own:
       iOS can still desync the layout viewport's height from the visual one after
       a double-tap, and height: 100% bakes in whatever that stale value was,
       leaving a gap below the last row. Fixed positioning re-reads the real
       viewport bounds instead of trusting a percentage that can go stale. Doesn't
       change where .menu/.sheet/etc. anchor — a plain position: fixed ancestor (no
       transform) isn't a containing block for its own fixed children, so they still
       resolve against the viewport exactly as before. */
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 120% 55% at 78% -6%, var(--sky), transparent 62%),
      linear-gradient(196deg, var(--bg-a) 0%, var(--bg-b) 46%, var(--bg-c) 100%);
  }
  /* god-rays, fixed so they don't scroll with the list */
  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 0;
    background: repeating-linear-gradient(74deg,
      transparent 0 38px, var(--ray) 38px 40px, transparent 40px 96px);
    mix-blend-mode: screen;
  }

  /* Top controls: square notched tiles, icon only.
     The notch is a true 45° cut at top-right and bottom-left — equal offset
     on both axes — matching the augmentation tiles in Deus Ex: HR. */
  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 12px 18px 8px;
    position: relative;
    z-index: 1;
  }
  .ctrl {
    width: 38px; height: 38px;
    flex-shrink: 0;
    border: none;
    background: linear-gradient(180deg, var(--tab-a), var(--tab-b));
    color: var(--ink-2);
    display: flex; align-items: center; justify-content: center;
    clip-path: polygon(
      0 0,
      calc(100% - 10px) 0,
      100% 10px,
      100% 100%,
      10px 100%,
      0 calc(100% - 10px)
    );
  }
  .ctrl svg { width: 18px; height: 18px; display: block; }
  .ctrl:active { filter: brightness(1.35); }
  /* Active nav entry fills solid; drop-shadow rather than box-shadow so the glow
     follows the notched outline instead of being clipped away. */
  .nav-btn.active {
    color: var(--on-acc);
    background: linear-gradient(180deg, var(--acc-hi), var(--acc));
    filter: drop-shadow(0 0 7px var(--acc-glow));
  }

  /* Bottom-sheet menu (create / edit) */
  .sheet-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 60;
  }
  .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--surface);
    border-top: 1px solid var(--bar-line);
    padding: 8px 18px calc(20px + env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    z-index: 61;
    max-height: 88%;
    overflow-y: auto;
  }
  .sheet.open { transform: translateY(0); }
  .sheet-grip {
    width: 34px; height: 3px;
    background: var(--acc-dim);
    margin: 7px auto 15px;
  }
  .field { margin-bottom: 16px; }
  /* Field labels borrow the category bar: filled strip, hairline, gold tick,
     rounded right cap. inline-flex so the bar hugs its text like a tab. */
  .field-label {
    display: inline-flex;
    align-items: center;
    height: 23px;
    padding: 0 12px 0 7px;
    margin-bottom: 9px;
    background: linear-gradient(90deg, var(--bar-a), var(--bar-b));
    border: 1px solid var(--bar-line);
    border-left: 2px solid var(--acc);
    border-radius: 0 12px 12px 0;
    font-size: 10.5px; font-weight: 600;
    color: var(--ink);
    text-transform: uppercase;
    letter-spacing: 0.19em;
  }
  .sheet input[type="text"], .sheet input[type="datetime-local"], .sheet input[type="date"], .sheet textarea {
    width: 100%;
    background: linear-gradient(180deg, var(--pan-a), var(--pan-b));
    border: 1px solid var(--row-line);
    padding: 13px 14px;
    color: var(--text);
    font-size: 16px;
    outline: none;
  }
  .sheet input[type="text"]:focus, .sheet input[type="datetime-local"]:focus, .sheet input[type="date"]:focus, .sheet textarea:focus { border-color: var(--acc); }
  /* Sits under the Now/Later chips, and only while Later is picked. color-scheme
     is what gets iOS to render its date wheel dark instead of on white. */
  .sheet input[type="datetime-local"], .sheet input[type="date"] {
    color-scheme: dark;
    -webkit-appearance: none;
    appearance: none;
  }
  /* Only the datetime-local sits under a chip row and needs the gap. */
  .sheet input[type="datetime-local"] { margin-top: 9px; }
  .sheet textarea {
    font-family: inherit;
    resize: vertical;
    min-height: 44px;
  }
  /* Read-only info row for the About sheet — same panel look as a text input,
     minus the interactive chrome, since there's nothing to type here. */
  .about-value {
    background: linear-gradient(180deg, var(--pan-a), var(--pan-b));
    border: 1px solid var(--row-line);
    padding: 13px 14px;
    color: var(--text);
    font-size: 15px;
  }

  /* Chip rows for category + tag pickers */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: linear-gradient(180deg, var(--pan-a), var(--pan-b));
    border: 1px solid var(--row-line);
    padding: 9px 13px;
    color: var(--text);
    font-size: 13px; font-weight: 500;
    letter-spacing: 0.06em;
    display: flex; align-items: center; gap: 6px;
  }
  .chip:active { opacity: 0.75; }
  .chip.selected {
    border-color: var(--acc);
    background: var(--acc-wash);
    color: var(--acc);
  }

  /* Elevated tier: the category edit, Organize and About sheets are all reachable
     only from the main screen (category "⋮" / "+ New Category") or the hamburger
     menu, never stacked above the task sheet, but share this tier since no two of
     the three are ever open at once. */
  #cat-backdrop, #cat-edit-backdrop, #about-backdrop { z-index: 80; }
  #cat-sheet, #cat-edit-sheet, #about-sheet { z-index: 81; }

  /* Deliberately NOT sticky. A create sheet with every field showing (Task,
     Comment, Tag, When, Repeat, Until) outgrows the sheet's 88% cap on an iPhone,
     and pinning this row so Save stayed reachable meant it painted over whatever
     scrolled beneath it — the last row of Repeat chips sat half-hidden under the
     button from the moment the sheet opened. A sheet that scrolls is ordinary; a
     control sliced in half looks broken. The row stays in flow at the end of the
     form, where every other sheet has always had it. */
  .sheet-actions { display: flex; gap: 10px; margin-top: 22px; }

  /* Organize-categories sheet rows */
  #cat-list { display: flex; flex-direction: column; gap: 3px; }
  .cat-row {
    display: flex;
    align-items: center;
    gap: 9px;
    background:
      repeating-linear-gradient(45deg, var(--hatch) 0 3px, transparent 3px 7px),
      linear-gradient(180deg, var(--pan-a), var(--pan-b));
    border-bottom: 1px solid var(--row-line);
    padding: 6px 10px;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  .cat-row.archived { opacity: 0.7; }
  .cat-name-static {
    flex: 1;
    min-width: 0;
    padding: 7px 6px;
    color: var(--ink-2);
    font-size: 16px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cat-restore-btn {
    flex-shrink: 0;
    background: var(--acc-wash);
    border: 1px solid var(--acc-dim);
    color: var(--acc);
    font-size: 12px; font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 7px 12px;
  }
  .cat-restore-btn:active { opacity: 0.75; }
  /* Action buttons carry the same opposing 45° notch as the FAB and the top
     tiles — the shape is reserved for things you press. No border: clip-path
     cuts it away on the diagonals. */
  .sheet-btn {
    flex: 1;
    border: none;
    padding: 15px;
    font-size: 13px; font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    clip-path: polygon(
      0 0,
      calc(100% - 12px) 0,
      100% 12px,
      100% 100%,
      12px 100%,
      0 calc(100% - 12px)
    );
  }
  .sheet-btn.primary {
    background: linear-gradient(180deg, var(--acc-hi), var(--acc));
    color: var(--on-acc);
  }
  .sheet-btn:disabled { opacity: 0.35; }
  .sheet-btn.secondary {
    background: linear-gradient(180deg, var(--tab-a), var(--tab-b));
    color: var(--ink);
  }
  .sheet-btn:active { filter: brightness(1.2); }
  /* Text-only, so a notch would have no fill to cut */
  .sheet-btn.danger {
    background: none; color: var(--danger);
    flex: 0 0 auto; padding: 15px 16px;
    clip-path: none;
  }
  /* Task sheet action row: Delete left, Save right at two thirds. Scoped by id so
     other sheets' own .sheet-btn.danger flex isn't disturbed. */
  #sheet-delete { flex: 1; }
  #sheet-save { flex: 2; }
  /* Category edit sheet's action row follows the same pattern: .sheet-btn.danger
     defaults to flex: 0 0 auto (text-only, no fill for the notch to cut), so Delete
     needs its own flex override to share the row evenly with Archive and Done. */
  #cat-edit-delete { flex: 1; }
  /* Up / Down / Top: three equal-width buttons, no extra top margin since the
     field-label above it already provides spacing (unlike .sheet-actions). */
  .cat-edit-move-row { display: flex; gap: 8px; }
  /* Now sits under its own "Finalize" field-label like the Order row above, so
     .sheet-actions' default margin-top would double up on the label's spacing. */
  #cat-edit-manage-actions { margin-top: 0; }

  /* Hamburger dropdown menu */
  .menu-btn { margin-left: auto; }
  .menu-backdrop {
    position: fixed; inset: 0;
    background: transparent;
    opacity: 0; pointer-events: none;
    z-index: 70;
  }
  .menu-backdrop.open { opacity: 1; pointer-events: auto; }
  .menu {
    position: fixed;
    top: calc(58px + env(safe-area-inset-top));
    right: calc(20px + env(safe-area-inset-right));
    background: var(--surface);
    border: 1px solid var(--bar-line);
    padding: 5px;
    min-width: 196px;
    box-shadow: 0 10px 34px rgba(0,0,0,0.5);
    opacity: 0;
    transform: translateY(-6px) scale(0.98);
    transform-origin: top right;
    pointer-events: none;
    transition: opacity 0.15s ease, transform 0.15s ease;
    z-index: 71;
  }
  .menu.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  .menu-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-left: 2px solid transparent;
    color: var(--text);
    font-size: 13px;
    letter-spacing: 0.08em;
    padding: 11px 13px;
  }
  .menu-item:active { background: var(--acc-wash); border-left-color: var(--acc); }
  .menu-item.danger { color: var(--danger); }
  .menu-sep { height: 1px; background: var(--row-line); margin: 4px 6px; }

  /* Scroll region holding all category sections */
  .scroll {
    flex: 1; overflow-y: auto;
    padding: 4px 18px calc(20px + env(safe-area-inset-bottom));
    -webkit-overflow-scrolling: touch;
    position: relative;
    z-index: 1;
  }

  .section { margin-bottom: 12px; }

  /* Category bar. Deliberately LIGHTER than the ground rather than darker:
     the list scrolls, so contrast can't depend on where the bar happens to
     sit against the background gradient. The left tick carries the category's
     home/work tag, or the mode accent when untagged. */
  .sec-head {
    display: flex;
    align-items: center;
    gap: 9px;
    height: 30px;
    padding: 0 4px 0 6px;
    background: linear-gradient(90deg, var(--bar-a), var(--bar-b));
    border: 1px solid var(--bar-line);
    border-left: 2px solid var(--acc);
    border-radius: 0 15px 15px 0;
    cursor: pointer;
    user-select: none;
  }
  .section.tag-home .sec-head { border-left-color: var(--home); }
  .section.tag-work .sec-head { border-left-color: var(--work); }
  /* Purely decorative now — the whole bar toggles collapse, so the caret no longer
     needs its own oversized touch target. */
  .sec-caret {
    color: var(--acc);
    width: 18px; height: 18px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s ease;
  }
  .section.tag-home .sec-caret { color: var(--home); }
  .section.tag-work .sec-caret { color: var(--work); }
  .sec-caret svg { width: 9px; height: 9px; display: block; }
  .section.collapsed .sec-caret { transform: rotate(-90deg); }
  .sec-title {
    flex: 1;
    text-align: right;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.19em;
    text-transform: uppercase;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* Opens the category edit sheet — plain icon, not a filled circle like .sec-add,
     so it doesn't compete with the "+" as the bar's primary action. */
  .sec-menu {
    flex-shrink: 0;
    width: 26px; height: 26px;
    border: none;
    background: none;
    color: var(--ink-2);
    display: flex; align-items: center; justify-content: center;
  }
  .sec-menu svg { width: 15px; height: 15px; display: block; }
  .sec-menu:active { color: var(--acc); }
  /* Filled, not outlined — the accent gradient reads more solidly than the
     hairline ring it replaced, and no border, since the fill defines the edge.
     Deliberately NO glow: the --acc-glow drop-shadow that the sheet's Save
     button and the active mode button carry is what marks a screen's dominant
     action, and this sits inline on a category bar next to the collapse caret.
     Same emphasis as that caret is the target, so the halo comes off and the
     flat fill stays. */
  .sec-add {
    flex-shrink: 0;
    width: 22px; height: 22px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(180deg, var(--acc-hi), var(--acc));
    color: var(--on-acc);
    display: flex; align-items: center; justify-content: center;
  }
  .sec-add svg { width: 11px; height: 11px; display: block; }
  .sec-add:active { filter: brightness(1.25); }
  .sec-body { margin-top: 5px; }
  .section.collapsed .sec-body { display: none; }

  /* Muted, low-emphasis by design — this isn't the primary action on the screen
     (adding a task to an existing category is), just an escape hatch to start a
     new one. It pops as a SURFACE rather than a louder line: an outline can only
     gain presence by getting brighter, and a loud outline on a secondary control
     reads like an error state (v34's 2px dotted border did exactly that). So it
     takes the accent wash as a fill, and the 45° notch — the shape the design
     reserves for things you press, which this is. No border, per the notch's own
     rule: clip-path cuts a border away on the diagonals, so the fill defines the
     edge. --acc-dim text keeps it well under the category "+" in emphasis. */
  .add-cat-btn {
    display: block;
    width: 100%;
    margin-top: 10px;
    padding: 12px;
    background: var(--acc-wash);
    border: none;
    color: var(--acc-dim);
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-align: center;
    clip-path: polygon(
      0 0,
      calc(100% - 12px) 0,
      100% 12px,
      100% 100%,
      12px 100%,
      0 calc(100% - 12px)
    );
  }
  .add-cat-btn:active { opacity: 0.7; }

  /* Task row: square-cornered slab with a 45° hatch, tightened to a ~37px
     pitch. No selection state — this is a touch app, nothing is "focused". */
  li {
    display: flex;
    align-items: center;
    gap: 9px;
    min-height: 34px;
    padding: 5px 11px;
    margin-bottom: 3px;
    list-style: none;
    background:
      repeating-linear-gradient(45deg, var(--hatch) 0 3px, transparent 3px 7px),
      linear-gradient(180deg, var(--pan-a), var(--pan-b));
    border-bottom: 1px solid var(--row-line);
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  li.dragging { opacity: 0.5; }
  li.drag-over { transform: translateY(2px); box-shadow: 0 0 0 2px var(--acc); }
  .handle {
    color: var(--ink-2);
    font-size: 15px;
    cursor: grab;
    touch-action: none;
    padding: 4px 2px;
    line-height: 1;
    opacity: 0.65;
    flex-shrink: 0;
  }
  /* Square check. Visually 17px but padded out to a comfortable tap target. */
  .check {
    width: 17px; height: 17px;
    border: 1px solid var(--acc-dim);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, border-color 0.15s;
  }
  li.done .check { background: var(--acc-dim); border-color: var(--acc-dim); }
  li.done .check::after {
    content: "\2713";
    color: var(--bg-c);
    font-size: 11px;
    line-height: 1;
    font-weight: 700;
  }
  .label { flex: 1; min-width: 0; display: flex; flex-direction: column; cursor: pointer; }
  .label-text { font-size: 14px; line-height: 1.3; word-break: break-word; }
  li.done .label-text { color: var(--ink-2); text-decoration: line-through; text-decoration-color: var(--acc-dim); }
  .label-comment {
    font-size: 12px;
    font-style: italic;
    line-height: 1.3;
    margin-top: 2px;
    color: var(--ink-2);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  /* Tag: dog-eared badge, bottom-right corner clipped — the counter tab that
     hangs off the augmentation tiles. */
  .tag-icon {
    flex-shrink: 0;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    line-height: 1;
    padding: 3px 6px;
    color: var(--on-acc);
    background: var(--acc);
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%);
  }
  .tag-priority { background: var(--alert); color: #1a0703; }
  .tag-pending { background: var(--acc-dim); color: var(--bg-c); }
  .tag-quick { background: var(--acc); color: var(--on-acc); }
  li.done .tag-icon { opacity: 0.4; }

  /* The Scheduled section deliberately does NOT wear the category bar. Reusing
     .sec-head made it read as another category, when it's the opposite: nothing in
     it is actionable today. So all three cues that say "category" come off — the
     lighter-than-ground fill, the accent left tick and caret, and the full-size
     title — leaving a hairline rule with a small caret and the word riding on its
     right end. A section break, not a thing you own.

     The box stays 34px tall even though the ink inside it is thinner than a category
     bar's: with no fill, height is invisible, so the tap target loses nothing while
     the weight does. `order` puts the rule first and pulls the caret and title to
     the right, where .sec-title's own right-alignment already sits. */
  .section-sched .sec-head {
    height: 34px;
    padding: 0 2px;
    gap: 10px;
    background: none;
    border: none;
    border-radius: 0;
  }
  .section-sched .sec-head::before {
    content: "";
    order: 1;
    flex: 1;
    height: 1px;
    background: var(--row-line);
  }
  .section-sched .sec-caret {
    order: 2;
    width: 12px; height: 12px;
    color: var(--ink-2);
  }
  .section-sched .sec-caret svg { width: 8px; height: 8px; }
  .section-sched .sec-title {
    order: 3;
    flex: 0 0 auto;
    font-size: 10.5px;
    letter-spacing: 0.24em;
    color: var(--ink-2);
  }

  /* Scheduled rows: the task slab minus its checkbox and drag handle — nothing to
     complete yet, and the order is the clock's, not the user's. They also drop the
     45° hatch and the panel gradient the task rows carry, for a flat near-transparent
     wash — a muted header over full-weight slabs still left the block looking like
     today's work. Neutral white rather than an accent-derived token, so the wash
     stays colourless against both palettes' ground. */
  li.sched {
    background: rgba(255, 255, 255, 0.02);
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }
  /* Text and icon drop from the accent to plain muted ink for the same reason the
     header did: --acc-dim is still the accent, and the accent is what marks the
     screen's live surfaces. */
  .section-sched .label-text { color: var(--ink-2); }
  .section-sched .label-when { color: var(--ink-2); opacity: 0.75; }
  .section-sched .sched-icon { color: var(--ink-2); opacity: 0.7; }
  .section-sched .tag-icon { opacity: 0.5; }
  .sched-icon {
    width: 17px; height: 17px;
    flex-shrink: 0;
    color: var(--acc-dim);
    display: flex; align-items: center; justify-content: center;
  }
  .sched-icon svg { width: 15px; height: 15px; display: block; }
  .label-when {
    font-size: 11.5px;
    line-height: 1.3;
    margin-top: 2px;
    letter-spacing: 0.05em;
    color: var(--acc-dim);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  /* ---- Archive screen ----
     The grouping toggle and search box. They live inside the scroll area (the
     layout has no per-screen chrome slot) but are built once per visit and then
     left alone — renderArchive() rebuilds only the group list below them, so a
     keystroke never detaches the focused input, which on iOS drops the keyboard
     mid-word. */
  .arch-bar { margin: 2px 0 12px; }
  .arch-search {
    width: 100%;
    margin-top: 9px;
    padding: 10px 12px;
    background: linear-gradient(180deg, var(--pan-a), var(--pan-b));
    border: 1px solid var(--row-line);
    color: var(--ink);
    font-family: inherit;
    font-size: 15px;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
    border-radius: 0;
  }
  .arch-search:focus { border-color: var(--acc); }
  .arch-summary {
    color: var(--ink-2);
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 0 2px 9px;
  }

  /* Group bars keep the category-bar chrome — a group here is still a thing you
     open — but the by-category view paints them in the category's own tag hue:
     Work steel, Home gold, whichever palette is active, since --work and --home
     are fixed. That colour IS the grouping, so it carries more than a left tick
     can. The screen's own palette is neutral (see [data-mode="mono"]), which
     leaves these bars as the only colour in the list — so the hue takes the bar's
     fill and hairline too, not just its tick, caret and title. Written as literal
     rgba rather than a token: the fixed hues have no wash/edge variants, and
     inventing four more tokens for two bars isn't worth it. */
  .arch-group.tag-work .sec-head {
    background: linear-gradient(90deg, rgba(169,189,204,0.22), rgba(169,189,204,0.09));
    border-color: rgba(169,189,204,0.34);
    border-left-color: var(--work);
  }
  .arch-group.tag-work .sec-caret,
  .arch-group.tag-work .sec-title { color: var(--work); }
  .arch-group.tag-home .sec-head {
    background: linear-gradient(90deg, rgba(217,164,65,0.20), rgba(217,164,65,0.08));
    border-color: rgba(217,164,65,0.32);
    border-left-color: var(--home);
  }
  .arch-group.tag-home .sec-caret,
  .arch-group.tag-home .sec-title { color: var(--home); }
  /* A date group has no tag to wear, so it stays neutral rather than borrowing the
     accent, which would read as "this one is special". */
  .arch-group.by-date .sec-head { border-left-color: var(--ink-2); }
  .arch-group.by-date .sec-caret { color: var(--ink-2); }
  /* Where a category bar carries its "⋮" and "+", a group bar carries its size:
     the archive is read, not edited, so there's no action to put here. */
  .sec-count {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--ink-2);
    padding: 0 9px 0 2px;
    font-variant-numeric: tabular-nums;
  }

  /* Archive rows take the Scheduled section's flat wash rather than the task
     slab's hatch and gradient, for the same reason: nothing in them is actionable.
     See li.sched above — same values, deliberately. */
  li.arch {
    background: rgba(255, 255, 255, 0.02);
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }
  li.arch .label { cursor: default; }
  li.arch .label-text { color: var(--ink-2); }
  li.arch .label-when { color: var(--ink-2); opacity: 0.75; }
  li.arch .label-comment { opacity: 0.8; }
  .arch-icon {
    width: 17px; height: 17px;
    flex-shrink: 0;
    color: var(--ink-2);
    opacity: 0.7;
    display: flex; align-items: center; justify-content: center;
  }
  .arch-icon svg { width: 13px; height: 13px; display: block; }
  .arch-more {
    color: var(--ink-2);
    font-size: 11px;
    letter-spacing: 0.06em;
    padding: 7px 4px 3px;
  }

  .sec-empty {
    color: var(--ink-2);
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 6px 4px 8px;
  }
  .empty-all { text-align: center; color: var(--ink-2); margin-top: 60px; font-size: 15px; line-height: 1.5; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(20px);
    background: linear-gradient(180deg, var(--tab-a), var(--tab-b));
    border: 1px solid var(--bar-line);
    color: var(--text);
    padding: 11px 18px;
    font-size: 13px;
    letter-spacing: 0.06em;
    opacity: 0; pointer-events: none;
    transition: all 0.25s;
    box-shadow: 0 6px 24px rgba(0,0,0,0.4);
    max-width: 80%; text-align: center;
    z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #file-input { display: none; }
</style>
</head>
<body>
  <div class="controls">
    <!-- Nav buttons are built from the NAV registry at startup and inserted
         before the menu button; see buildNav(). -->
    <button class="ctrl menu-btn" id="menu-btn" aria-label="Menu" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>

  <input type="file" id="file-input" accept=".json,application/json">

  <div class="menu-backdrop" id="menu-backdrop"></div>
  <div class="menu" id="menu" role="menu">
    <button class="menu-item" id="show-all-btn" role="menuitem">Show all</button>
    <button class="menu-item" id="collapse-all-btn" role="menuitem">Collapse all</button>
    <div class="menu-sep"></div>
    <button class="menu-item" id="organize-cats-btn" role="menuitem">Restore categories</button>
    <div class="menu-sep"></div>
    <button class="menu-item" id="export-btn" role="menuitem">↓ Export backup</button>
    <button class="menu-item" id="import-btn" role="menuitem">↑ Restore backup</button>
    <div class="menu-sep"></div>
    <button class="menu-item" id="archive-done-btn" role="menuitem">🗄 Archive done</button>
    <div class="menu-sep"></div>
    <button class="menu-item" id="about-btn" role="menuitem">About</button>
  </div>

  <div class="scroll" id="scroll"></div>

  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-grip"></div>

    <div class="field">
      <label class="field-label" for="sheet-text">Task</label>
      <input id="sheet-text" type="text" placeholder="What needs doing?" autocomplete="off" enterkeyhint="done">
    </div>

    <div class="field">
      <label class="field-label" for="sheet-comment">Comment (optional)</label>
      <textarea id="sheet-comment" rows="2" placeholder="Add a note..." enterkeyhint="done"></textarea>
    </div>

    <div class="field">
      <span class="field-label">Tag (optional)</span>
      <div class="chips" id="sheet-tags"></div>
    </div>

    <!-- Scheduling. Now is the default, so the everyday create flow costs no extra
         taps; Later reveals the picker. Hidden when editing a task that already
         lives in the list — sending one back to the future isn't a thing. -->
    <div class="field" id="sheet-when-field">
      <span class="field-label">When</span>
      <div class="chips" id="sheet-when-chips"></div>
      <input id="sheet-when" type="datetime-local">
    </div>

    <!-- Repeat and Until ride with the picker: both are meaningless until there's a
         first occurrence to anchor them to. Weekly/Monthly take their weekday and
         day-of-month from that first occurrence, so neither needs a sub-picker. -->
    <div class="field" id="sheet-repeat-field">
      <span class="field-label">Repeat</span>
      <div class="chips" id="sheet-repeat-chips"></div>
    </div>

    <div class="field" id="sheet-until-field">
      <label class="field-label" for="sheet-until">Until (optional)</label>
      <input id="sheet-until" type="date">
    </div>

    <!-- No Cancel: the backdrop tap dismisses. Delete only appears when editing,
         so Save spans the whole row when creating. -->
    <div class="sheet-actions">
      <button class="sheet-btn danger" id="sheet-delete" style="display:none;">Delete</button>
      <button class="sheet-btn primary" id="sheet-save" disabled>Add task</button>
    </div>
  </div>

  <div class="sheet-backdrop" id="cat-backdrop"></div>
  <div class="sheet" id="cat-sheet" role="dialog" aria-modal="true">
    <div class="sheet-grip"></div>

    <div class="field">
      <span class="field-label">Archived</span>
      <div id="cat-list"></div>
    </div>

    <div class="sheet-actions">
      <button class="sheet-btn secondary" id="cat-done-btn">Done</button>
    </div>
  </div>

  <div class="sheet-backdrop" id="cat-edit-backdrop"></div>
  <div class="sheet" id="cat-edit-sheet" role="dialog" aria-modal="true">
    <div class="sheet-grip"></div>

    <div class="field">
      <label class="field-label" for="cat-edit-name">Category</label>
      <input id="cat-edit-name" type="text" autocomplete="off" enterkeyhint="done">
    </div>

    <div class="field">
      <span class="field-label">Type</span>
      <div class="chips" id="cat-edit-type-chips"></div>
    </div>

    <div class="field" id="cat-edit-order-field">
      <span class="field-label">Order</span>
      <div class="cat-edit-move-row">
        <button class="sheet-btn secondary" id="cat-edit-move-up">Up</button>
        <button class="sheet-btn secondary" id="cat-edit-move-down">Down</button>
        <button class="sheet-btn secondary" id="cat-edit-move-top">Top</button>
      </div>
    </div>

    <!-- No Done: like the task sheet, the backdrop tap is the only dismissal. -->
    <div class="field" id="cat-edit-finalize-field">
      <span class="field-label">Finalize</span>
      <div class="sheet-actions" id="cat-edit-manage-actions">
        <button class="sheet-btn danger" id="cat-edit-delete">Delete</button>
        <button class="sheet-btn secondary" id="cat-edit-archive">Archive</button>
      </div>
    </div>

    <!-- The name already commits on blur/Enter, but there was no explicit
         commit-and-close action to aim at; this is the category sheet's
         equivalent of the task sheet's Save. Stays visible when creating,
         where the Finalize field above it is hidden. -->
    <div class="sheet-actions">
      <button class="sheet-btn primary" id="cat-edit-save">Add category</button>
    </div>
  </div>

  <div class="sheet-backdrop" id="about-backdrop"></div>
  <div class="sheet" id="about-sheet" role="dialog" aria-modal="true">
    <div class="sheet-grip"></div>

    <div class="field">
      <span class="field-label">Version</span>
      <div class="about-value" id="about-version"></div>
    </div>

    <div class="field">
      <span class="field-label">Last updated</span>
      <div class="about-value" id="about-updated"></div>
    </div>

    <div class="sheet-actions">
      <button class="sheet-btn secondary" id="about-done-btn">Done</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  // Shown in the About sheet (hamburger menu). A rolling integer, not a git hash —
  // bump by 1 and set APP_UPDATED to today on every code edit, in the same commit
  // as the edit itself (see the Version section in CLAUDE.md, which must be updated
  // to match in that same commit). Started at 23 rather than 1: that's how many
  // prior commits had already touched index.html (`git log --oneline -- index.html`)
  // as of the commit that introduced this counter, so the number reflects the app's
  // real edit history instead of resetting it to zero.
  const APP_VERSION = 39;
  const APP_UPDATED = "2026-08-25";

  const KEY = "todos.v2";

  const scroll = document.getElementById("scroll");
  const toast = document.getElementById("toast");
  const fileInput = document.getElementById("file-input");

  // Bottom sheet for task create/edit
  const sheet = document.getElementById("sheet");
  const sheetBackdrop = document.getElementById("sheet-backdrop");
  const sheetText = document.getElementById("sheet-text");
  const sheetComment = document.getElementById("sheet-comment");
  const sheetTags = document.getElementById("sheet-tags");
  const sheetWhenField = document.getElementById("sheet-when-field");
  const sheetWhenChips = document.getElementById("sheet-when-chips");
  const sheetWhenInput = document.getElementById("sheet-when");
  const sheetRepeatField = document.getElementById("sheet-repeat-field");
  const sheetRepeatChips = document.getElementById("sheet-repeat-chips");
  const sheetUntilField = document.getElementById("sheet-until-field");
  const sheetUntilInput = document.getElementById("sheet-until");
  const sheetSave = document.getElementById("sheet-save");
  const sheetDelete = document.getElementById("sheet-delete");

  // Organize-categories sheet — restore-only; see renderCatList()
  const catSheet = document.getElementById("cat-sheet");
  const catBackdrop = document.getElementById("cat-backdrop");
  const catList = document.getElementById("cat-list");
  const catDoneBtn = document.getElementById("cat-done-btn");

  // Per-category edit sheet, opened either by a category bar's "⋮" button (editing) or
  // the main screen's "+ New Category" button (creating; see openCategoryCreateSheet)
  const catEditSheet = document.getElementById("cat-edit-sheet");
  const catEditBackdrop = document.getElementById("cat-edit-backdrop");
  const catEditName = document.getElementById("cat-edit-name");
  const catEditTypeChips = document.getElementById("cat-edit-type-chips");
  const catEditOrderField = document.getElementById("cat-edit-order-field");
  const catEditMoveUp = document.getElementById("cat-edit-move-up");
  const catEditMoveDown = document.getElementById("cat-edit-move-down");
  const catEditMoveTop = document.getElementById("cat-edit-move-top");
  const catEditFinalizeField = document.getElementById("cat-edit-finalize-field");
  const catEditArchiveBtn = document.getElementById("cat-edit-archive");
  const catEditDeleteBtn = document.getElementById("cat-edit-delete");
  const catEditSaveBtn = document.getElementById("cat-edit-save");

  // About sheet — static version/timestamp display, no editable state
  const aboutSheet = document.getElementById("about-sheet");
  const aboutBackdrop = document.getElementById("about-backdrop");
  const aboutVersionEl = document.getElementById("about-version");
  const aboutUpdatedEl = document.getElementById("about-updated");
  const aboutDoneBtn = document.getElementById("about-done-btn");

  // Available tags. `short` is what shows on the task row as a dog-eared badge;
  // `label` is the full name used in the picker and for accessibility.
  const TAGS = [
    { id: "priority", label: "Priority", short: "PRIO" },
    { id: "pending", label: "Wait", short: "WAIT" },
    { id: "quick", label: "Quick", short: "QUICK" }
  ];
  function tagById(id) {
    if (!id) return null;
    for (let i = 0; i < TAGS.length; i++) { if (TAGS[i].id === id) return TAGS[i]; }
    return null;
  }

  // Category tags: every category is either "home" or "work" — there is no untagged
  // state. Toggled via chips in the category edit sheet, and shown as a colored accent
  // bar on the main-screen category section.
  //
  // `categoryTags` can still be sparse: categories created before tagging existed have
  // no entry, and so does anything restored from an old backup. Reading a missing entry
  // as "work" is what keeps those reachable — the mode filter hides everything that
  // isn't the active mode, so a genuinely untagged category would show up nowhere.
  function tagOf(cat) {
    return state.categoryTags[cat] === "home" ? "home" : "work";
  }

  // Transient state for whatever the sheet is currently editing/creating
  let sheetCtx = null; // { mode:'create'|'edit'|'pending', cat, tag, later, when, repeatKind, until, taskCat, taskIndex, pendingIndex }
  // `later` is the When picker's own state, kept separate from `when` so clearing the
  // date field doesn't silently snap the sheet back to "Now" under the user's finger.
  // `repeatKind` is a REPEATS id (or null), not a pattern object: the pattern is built
  // at save time from the id plus the chosen first occurrence, so its weekday /
  // day-of-month anchors can't go stale while the date is still being edited.

  // State shape: { categories: ["Home", ...], active: "Home",
  //   tasks: { "Home": [ {text, done, tag, createdAt, completedAt} ] },
  //   categoryTags: { "Home": "home" | "work" },
  //   pending: [ {text, tag, comment, cat, dueAt, repeat, createdAt} ] }
  // createdAt is set once at creation. completedAt is set when done becomes true and
  // cleared back to null if unchecked. Tasks created before this field existed simply
  // lack it (undefined) until next touched.
  // `active` is retained for back-compat; here it's the default category for the Add box.
  // `categoryTags` may be sparse; read it through tagOf(), never directly.
  // `pending` holds scheduled tasks that haven't joined the list yet — see the
  // "Scheduled (pending) tasks" section below.
  let state = load();

  // Per-category collapsed state, keyed by category name. Kept in localStorage; not part of the JSON backup.
  const COLLAPSE_KEY = "todos.v2.collapsed";
  let collapsed = loadCollapsed();

  // Work Mode / Home Mode: "home" | "work". Always one or the other — the mode filters
  // the list, so there is no "no mode" state to fall back to (it would render an empty
  // screen). Purely a render-time filter + collapse preset; never mutates
  // state.categories. Kept in localStorage; not part of the JSON backup.
  const MODE_KEY = "todos.v2.mode";
  let viewMode = loadViewMode();

  // Archived (completed) tasks live in their own localStorage key, separate from `state`.
  // This keeps every routine save() (checking a box, dragging a row) cheap regardless of how
  // much history has piled up — only archiveDone()/trimArchive() touch this key. Write-only
  // for now: no in-app viewer yet (see backlog), archive contents are only inspectable via
  // JSON export, which includes them.
  const ARCHIVE_KEY = "todos.v2.archive";
  const ARCHIVE_THRESHOLD = 5000;
  let archive = loadArchive();
  function loadArchive() {
    try {
      const a = JSON.parse(localStorage.getItem(ARCHIVE_KEY));
      if (Array.isArray(a)) return a;
    } catch (e) {}
    return [];
  }
  function saveArchive() { localStorage.setItem(ARCHIVE_KEY, JSON.stringify(archive)); }

  // Seed data for a first launch: the app opens on a worked example rather than one
  // empty "Home" category. This is verbatim the `state` section of a JSON backup export
  // (todos-backup-init.json), so refreshing it means exporting a new backup and pasting
  // its `state` object here — no hand-authoring. Only reached when localStorage holds
  // nothing this app can read; an existing install never sees it. The createdAt stamps
  // are the real ones from that export and are deliberately left as literals — nothing
  // in the UI surfaces them today, and generating them at launch would make the seed
  // stop being a straight paste of a backup.
  function defaultState() {
    return {
      categories: ["Home", "Project A", "Project B"],
      active: "Project B",
      tasks: {
        "Home": [
          { text: "Shop for groceries", done: false, tag: null, comment: null, createdAt: "2026-08-18T16:02:17.876Z", completedAt: null },
          { text: "Water plants", done: false, tag: "quick", comment: null, createdAt: "2026-08-18T16:02:43.415Z", completedAt: null }
        ],
        "Project A": [
          { text: "Identify engineering resources required", done: false, tag: "priority", comment: null, createdAt: "2026-08-18T15:58:58.478Z", completedAt: null },
          { text: "Plan features", done: false, tag: null, comment: "Work order submission. Status tracking. Report generation", createdAt: "2026-08-18T16:00:19.252Z", completedAt: null },
          { text: "Get management sign off", done: false, tag: "pending", comment: null, createdAt: "2026-08-18T16:01:42.347Z", completedAt: null }
        ],
        "Project B": [
          { text: "Send bill to client", done: false, tag: "priority", comment: null, createdAt: "2026-08-18T16:03:31.498Z", completedAt: null }
        ]
      },
      categoryTags: { "Home": "home", "Project A": "work", "Project B": "work" },
      categoryArchived: {},
      pending: []
    };
  }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && s.categories && s.tasks) {
        if (!s.categoryTags || typeof s.categoryTags !== "object") s.categoryTags = {};
        if (!s.categoryArchived || typeof s.categoryArchived !== "object") s.categoryArchived = {};
        if (!Array.isArray(s.pending)) s.pending = [];
        return s;
      }
    } catch (e) {}
    // migrate old v1 flat list if present
    try {
      const old = JSON.parse(localStorage.getItem("todos.v1"));
      if (Array.isArray(old) && old.length) {
        return { categories: ["Home"], active: "Home", tasks: { "Home": old }, categoryTags: {}, categoryArchived: {}, pending: [] };
      }
    } catch (e) {}
    return defaultState();
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

  function loadCollapsed() {
    try {
      const c = JSON.parse(localStorage.getItem(COLLAPSE_KEY));
      if (c && typeof c === "object") return c;
    } catch (e) {}
    return {};
  }
  function saveCollapsed() { localStorage.setItem(COLLAPSE_KEY, JSON.stringify(collapsed)); }

  // Guarded like the other loaders. localStorage can throw outright rather than
  // return null — opaque origins, Safari private browsing, storage disabled. An
  // unguarded throw here is especially bad: it leaves the `viewMode` binding
  // uninitialised, so every later read (including render()'s) hits the temporal
  // dead zone and throws again, blanking the whole app rather than degrading it.
  // Work is the default on a first launch; a returning user gets the mode they left in.
  function loadViewMode() {
    try {
      const m = localStorage.getItem(MODE_KEY);
      if (m === "home" || m === "work") return m;
    } catch (e) {}
    return "work";
  }
  function saveViewMode() {
    try { localStorage.setItem(MODE_KEY, viewMode); } catch (e) {}
  }

  // Switching mode leaves each category's collapse state as you left it. Tapping the
  // mode you're already in is a no-op rather than a clear — clearing would leave
  // nothing to show, and a stray tap would otherwise undo whatever you'd collapsed by
  // hand. Category order is never mutated.
  function setViewMode(next) {
    if (viewMode === next) return;
    viewMode = next;
    saveViewMode();
    render();
    scroll.scrollTop = 0;
  }

  // The mode is a filter: only its own, non-archived categories are on screen, in saved order.
  function displayCategories() {
    return state.categories.filter(function (c) { return tagOf(c) === viewMode && !isArchived(c); });
  }

  // ---- Scheduled (pending) tasks ----
  // A scheduled task is one that hasn't joined the list yet: it waits in
  // `state.pending` until its `dueAt` arrives, and promotePending() then moves it
  // into its category as an ordinary task. It lives inside `state` rather than in
  // a key of its own — the archive was split off because it accumulates thousands
  // of rows, while this list is small and bounded — so it rides the existing
  // backup domain and cascades with category renames for free.
  //
  // Entry shape: { text, tag, comment, cat, dueAt, repeat, createdAt } — the same
  // fields a task carries, plus dueAt and repeat. `repeat` is null for a one-shot
  // ("future") task, which is then consumed by its promotion; a recurring task
  // carries a pattern there and re-arms its own dueAt via nextDueAfter() each time
  // it fires, so a single entry stands in for the whole series.
  //
  // Pattern shape: { kind: "days", n } | { kind: "weekly", weekday } |
  // { kind: "monthly", day }, each with `until` — a local "YYYY-MM-DD" date, or
  // null for no end. "Every day" and "every two days" are one kind with n = 1 or 2
  // rather than two kinds; the sheet only offers those two, but nothing in the
  // model objects to n = 3.
  //
  // `weekday` and `day` are anchors derived from the first occurrence when the
  // sheet saves, and stored rather than re-read from dueAt on each step. Monthly is
  // why: a task on the 31st has to fire Feb 28 and then March 31, so the step has
  // to know the intended day-of-month, not the clamped one it last landed on.

  // Collapse-map key for the Scheduled section, sharing the per-category collapse
  // map. A category actually named __scheduled__ would collapse in step with this
  // section — harmless, and the alternative (a control character) puts a byte in
  // the source that tooling treats as binary.
  const SCHEDULED_KEY = "__scheduled__";

  // Entries for the given mode, soonest first, each with its index in state.pending.
  // An entry whose category has gone missing reads as "work" through tagOf(), same
  // fallback that keeps legacy untagged categories reachable.
  function pendingFor(mode) {
    const out = [];
    state.pending.forEach(function (p, i) {
      if (tagOf(p.cat) === mode) out.push({ entry: p, index: i });
    });
    out.sort(function (a, b) { return Date.parse(a.entry.dueAt) - Date.parse(b.entry.dueAt); });
    return out;
  }

  // "Today, 08:00" / "Tomorrow, 08:00" / "Tue, Aug 25, 08:00". The near days get
  // named because that's what most scheduled tasks are, and a weekday reads faster
  // than a date when you're glancing at the list on a train.
  function timeOf(iso) {
    const d = new Date(iso);
    return isNaN(d.getTime()) ? "" : d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  function formatWhen(iso) {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    const time = timeOf(iso);
    const midnightToday = new Date(); midnightToday.setHours(0, 0, 0, 0);
    const midnightDue = new Date(d); midnightDue.setHours(0, 0, 0, 0);
    const days = Math.round((midnightDue - midnightToday) / 86400000);
    if (days === 0) return "Today, " + time;
    if (days === 1) return "Tomorrow, " + time;
    return d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" }) + ", " + time;
  }

  const WEEKDAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

  function ordinal(n) {
    const tens = n % 100;
    if (tens >= 11 && tens <= 13) return n + "th";
    return n + (["th", "st", "nd", "rd"][n % 10] || "th");
  }

  function daysInMonth(year, month) { return new Date(year, month + 1, 0).getDate(); }

  // "Every day" / "Every 2 days" / "Every Monday" / "Monthly on the 15th".
  function repeatLabel(r) {
    if (!r) return null;
    if (r.kind === "days") return (r.n || 1) === 1 ? "Every day" : "Every " + r.n + " days";
    if (r.kind === "weekly") return "Every " + (WEEKDAYS[r.weekday] || "week");
    if (r.kind === "monthly") return "Monthly on the " + ordinal(r.day || 1);
    return null;
  }

  // The pattern's end, as the last instant of that local day — `until` is a plain
  // calendar date, so a task due at 08:00 on its end date still fires.
  function untilCutoff(until) {
    const parts = /^(\d{4})-(\d{2})-(\d{2})$/.exec(until || "");
    if (!parts) return null;
    return new Date(+parts[1], +parts[2] - 1, +parts[3], 23, 59, 59, 999).getTime();
  }

  // One step forward. Local-calendar arithmetic throughout (setDate, not
  // millisecond addition), so an 08:00 task stays at 08:00 across a DST boundary
  // instead of drifting an hour.
  function stepOccurrence(from, r) {
    const d = new Date(from);
    if (r.kind === "days") { d.setDate(d.getDate() + Math.max(1, r.n || 1)); return d; }
    if (r.kind === "weekly") { d.setDate(d.getDate() + 7); return d; }
    if (r.kind === "monthly") {
      // Rebuild from the anchor day rather than stepping the current date, and clamp
      // to the target month's length: the 31st becomes Feb 28 for February only, and
      // is back to the 31st in March.
      const day = r.day || d.getDate();
      const next = new Date(d.getFullYear(), d.getMonth() + 1, 1, d.getHours(), d.getMinutes(), 0, 0);
      next.setDate(Math.min(day, daysInMonth(next.getFullYear(), next.getMonth())));
      return next;
    }
    return null;
  }

  // The second line of a Scheduled row. A repeating entry names its pattern instead
  // of its next date — for a daily task "Tomorrow" is noise, and the pattern is the
  // thing you actually want to check at a glance. Either way the row names its own
  // category, since the section spans them.
  function pendingWhenLine(p) {
    const lbl = repeatLabel(p.repeat);
    return (lbl ? lbl + ", " + timeOf(p.dueAt) : formatWhen(p.dueAt)) + " · " + p.cat;
  }

  // Given an entry that has just been promoted, the ISO stamp of its next
  // occurrence, or null when it's finished. A one-shot entry has no pattern, so
  // promoting it consumes it.
  function nextDueAfter(entry) {
    const r = entry.repeat;
    if (!r) return null;
    const from = new Date(entry.dueAt);
    if (isNaN(from.getTime())) return null;

    // Skip past every occurrence that elapsed while the app was closed: a daily
    // task left for a week comes back as one task, not seven. The counter only
    // guards against a malformed pattern that fails to advance — a well-formed one
    // always moves forward, so it can't spin.
    const now = Date.now();
    let next = stepOccurrence(from, r);
    let guard = 0;
    while (next && next.getTime() <= now && guard++ < 10000) next = stepOccurrence(next, r);
    if (!next || next.getTime() <= now) return null;

    const cutoff = untilCutoff(r.until);
    if (cutoff !== null && next.getTime() > cutoff) return null; // pattern is spent
    return next.toISOString();
  }

  function addPendingTask(p) {
    if (!state.tasks[p.cat]) state.tasks[p.cat] = [];
    // createdAt stamps when the task joined the list, not when it was scheduled —
    // the entry's own createdAt already records the latter.
    state.tasks[p.cat].push({
      text: p.text, done: false, tag: p.tag || null, comment: p.comment || null,
      createdAt: new Date().toISOString(), completedAt: null
    });
  }

  // Moves every entry whose moment has arrived into its category. Returns the
  // promoted entries, or null if nothing moved. Called at launch and again
  // whenever the app returns to the foreground: an iOS PWA can sit suspended for
  // days, so launch alone would miss the ordinary case of reopening yesterday's
  // session. Entries whose category is missing or archived are held rather than
  // dropped — the category may come back, and silently discarding a task the user
  // scheduled is worse than a row that lingers.
  function promotePending() {
    if (!state.pending.length) return null;
    const now = Date.now();
    const keep = [];
    const added = [];
    state.pending.forEach(function (p) {
      const due = Date.parse(p.dueAt);
      if (isNaN(due) || due > now) { keep.push(p); return; }
      if (state.categories.indexOf(p.cat) === -1 || isArchived(p.cat)) { keep.push(p); return; }
      addPendingTask(p);
      added.push(p);
      const next = nextDueAfter(p);
      if (next) { p.dueAt = next; keep.push(p); }
    });
    if (!added.length) return null;
    state.pending = keep;
    save();
    return added;
  }

  // Promotion is silent otherwise: a task appearing in a collapsed category would
  // be invisible, and force-expanding it would override a collapse the user chose.
  function promoteAndReport() {
    const added = promotePending();
    if (!added) return false;
    showToast(added.length === 1
      ? '"' + added[0].text + '" added to ' + added[0].cat
      : added.length + " scheduled tasks added");
    return true;
  }

  // ---- Screen layer ----
  // The app is a set of screens sharing the top bar and the scroll area. Each
  // entry owns the scroll area's renderer and its palette (a data-mode value, or
  // null for the :root gold). `viewMode` (home/work) stays a sub-state of the
  // todos screen — it is not a screen itself.
  const SCREENS = {
    todos: {
      render: renderTodoList,
      palette: function () { return viewMode === "work" ? "work" : null; }
    },
    archive: {
      render: renderArchive,
      // Its own palette, and the only screen that doesn't wear a mode's: black and
      // white. It first inherited whichever palette the todos screen was wearing, so
      // arriving wouldn't read as a mode switch — but the archive spans both tags at
      // once, and an accent tint over it implies a mode the screen doesn't have.
      // Draining it leaves the fixed --work/--home hues on the group bars as the only
      // colour, which is the grouping itself.
      palette: function () { return "mono"; }
    }
  };

  // data-mode value → iOS status-bar colour. Falls back to the :root gold.
  const BAR_COLORS = { default: "#0d0a06", work: "#090c0f", mono: "#000000" };

  // Which screen owns the scroll area. Persisted like the mode, guarded the
  // same way (see loadViewMode's comment). An unknown saved id — say, from a
  // version that had screens this one doesn't — falls back to todos.
  const SCREEN_KEY = "todos.v2.screen";
  let screen = loadScreen();
  function loadScreen() {
    try {
      const s = localStorage.getItem(SCREEN_KEY);
      if (s && SCREENS[s]) return s;
    } catch (e) {}
    return "todos";
  }
  function saveScreen() {
    try { localStorage.setItem(SCREEN_KEY, screen); } catch (e) {}
  }
  function setScreen(next) {
    if (!SCREENS[next] || screen === next) return;
    screen = next;
    saveScreen();
    render();
    // A new screen starts at its own top, not at the previous one's scroll offset —
    // same reason setViewMode resets it.
    scroll.scrollTop = 0;
  }

  // Top-bar nav registry. Todos contributes two entries — Work and Home are
  // its viewMode sub-state, but at the bar they behave like screens of their
  // own, so a tap sets both. Future screens append one entry each. Buttons
  // are built once at startup (buildNav) and inserted before the menu button;
  // render() only toggles their active state, never rebuilds them.
  const NAV = [
    {
      id: "work", label: "Work mode", cls: "nav-btn nav-work",
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13"/><path d="M9 7V4h6v3"/><path d="M3 12h18"/></svg>',
      isActive: function () { return screen === "todos" && viewMode === "work"; },
      onTap: function () { setScreen("todos"); setViewMode("work"); }
    },
    {
      id: "home", label: "Home mode", cls: "nav-btn nav-home",
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7v9h-6v-6h-6v6H3z"/></svg>',
      isActive: function () { return screen === "todos" && viewMode === "home"; },
      onTap: function () { setScreen("todos"); setViewMode("home"); }
    },
    {
      id: "archive", label: "Archive", cls: "nav-btn nav-archive",
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="4"/><path d="M5 8v12h14V8"/><path d="M10 12h4"/></svg>',
      // A screen, not a mode: it carries no viewMode of its own, and Work/Home stay
      // lit only while the todos screen owns the scroll area.
      isActive: function () { return screen === "archive"; },
      onTap: function () { setScreen("archive"); }
    }
  ];
  const navButtons = {}; // id → button element, filled by buildNav
  function buildNav() {
    const menuBtn = document.getElementById("menu-btn");
    NAV.forEach(function (entry) {
      const b = document.createElement("button");
      b.className = "ctrl " + entry.cls;
      b.innerHTML = entry.icon;
      b.setAttribute("aria-label", entry.label);
      b.setAttribute("aria-pressed", "false");
      b.onclick = entry.onTap;
      navButtons[entry.id] = b;
      menuBtn.parentNode.insertBefore(b, menuBtn);
    });
  }

  let toastTimer;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 2200);
  }

  // ---- Category operations (used by the organize-categories sheet) ----
  // Each returns true on success, or a string error message on failure.
  function createCategory(name) {
    name = (name || "").trim();
    if (!name) return "Enter a name";
    if (state.categories.indexOf(name) !== -1) {
      return isArchived(name)
        ? '"' + name + '" is archived — restore it from the menu to reuse the name'
        : "Category already exists";
    }
    state.categories.push(name);
    state.tasks[name] = [];
    // New categories are Work by default. Written explicitly rather than left to tagOf()'s
    // fallback so the tag is visible in an export.
    state.categoryTags[name] = "work";
    save();
    return true;
  }

  function renameCategory(oldName, newName) {
    newName = (newName || "").trim();
    if (!newName) return "Enter a name";
    if (newName === oldName) return true;
    if (state.categories.indexOf(newName) !== -1) return "Name already exists";
    const idx = state.categories.indexOf(oldName);
    if (idx === -1) return "Category not found";
    state.categories[idx] = newName;
    state.tasks[newName] = state.tasks[oldName];
    delete state.tasks[oldName];
    if (state.categoryTags[oldName] !== undefined) { state.categoryTags[newName] = state.categoryTags[oldName]; delete state.categoryTags[oldName]; }
    if (state.categoryArchived[oldName] !== undefined) { state.categoryArchived[newName] = state.categoryArchived[oldName]; delete state.categoryArchived[oldName]; }
    if (collapsed[oldName] !== undefined) { collapsed[newName] = collapsed[oldName]; delete collapsed[oldName]; saveCollapsed(); }
    if (state.active === oldName) state.active = newName;
    state.pending.forEach(function (p) { if (p.cat === oldName) p.cat = newName; });
    // Archived tasks carry the category name they had when archived — without this,
    // a rename splits that category's history across the old and new names.
    let archiveChanged = false;
    archive.forEach(function (entry) {
      if (entry.category === oldName) { entry.category = newName; archiveChanged = true; }
    });
    save();
    if (archiveChanged) saveArchive();
    return true;
  }

  function deleteCategory(cat) {
    if (state.categories.length === 1) return "Keep at least one category";
    const idx = state.categories.indexOf(cat);
    if (idx === -1) return "Category not found";
    state.categories.splice(idx, 1);
    delete state.tasks[cat];
    delete state.categoryTags[cat];
    delete state.categoryArchived[cat];
    state.pending = state.pending.filter(function (p) { return p.cat !== cat; });
    delete collapsed[cat]; saveCollapsed();
    if (state.active === cat) state.active = state.categories[0];
    save();
    return true;
  }

  // Home <-> Work. Two-way: there is no untagged state to cycle through.
  function toggleCategoryTag(cat) {
    state.categoryTags[cat] = tagOf(cat) === "home" ? "work" : "home";
    save();
  }

  // A category can only be archived once it has no unfinished tasks — that's what keeps
  // this small: no second task-payload store, just a flag. Its completed tasks sweep into
  // the archive via the same path as "Archive done"; the category itself never leaves
  // state.categories, so restoring needs nothing more than clearing the flag and its
  // position is already exactly where it was.
  function isArchived(cat) { return !!state.categoryArchived[cat]; }

  function archiveCategory(cat) {
    const idx = state.categories.indexOf(cat);
    if (idx === -1) return "Category not found";
    if (isArchived(cat)) return true;
    const activeCount = state.categories.filter(function (c) { return !isArchived(c); }).length;
    if (activeCount <= 1) return "Keep at least one category";
    const tasks = state.tasks[cat] || [];
    if (tasks.some(function (t) { return !t.done; })) return "Finish or delete remaining tasks first";
    // A scheduled task can't land in an archived category, so it would sit there
    // stranded. Same shape of guard as the unfinished-tasks one above.
    if (state.pending.some(function (p) { return p.cat === cat; })) return "Delete its scheduled tasks first";
    const n = sweepDoneTasks(cat);
    state.categoryArchived[cat] = true;
    delete collapsed[cat]; saveCollapsed();
    save();
    if (n) saveArchive();
    return true;
  }

  function restoreCategory(cat) {
    const idx = state.categories.indexOf(cat);
    if (idx === -1) return "Category not found";
    delete state.categoryArchived[cat];
    save();
    return true;
  }

  // Up/Down/Top on the category edit sheet reorder relative to the category's *displayed*
  // neighbors (same tag, not archived) rather than raw array position. state.categories can
  // have the other tag's categories interleaved between two same-tag ones, so stepping by a
  // raw index could shuffle position without changing anything the user can see — or worse,
  // silently reorder categories in the *other* mode as a side effect.
  function categoryNeighbors(cat) {
    const tag = tagOf(cat);
    return state.categories.filter(function (c) { return tagOf(c) === tag && !isArchived(c); });
  }

  // Swaps only these two entries' positions, leaving everything else (including any
  // interleaved other-tag categories sitting between them) undisturbed.
  function swapCategories(a, b) {
    const ai = state.categories.indexOf(a);
    const bi = state.categories.indexOf(b);
    if (ai === -1 || bi === -1) return;
    state.categories[ai] = b;
    state.categories[bi] = a;
    save();
  }

  function moveCategoryUp(cat) {
    const list = categoryNeighbors(cat);
    const i = list.indexOf(cat);
    if (i <= 0) return;
    swapCategories(cat, list[i - 1]);
  }

  function moveCategoryDown(cat) {
    const list = categoryNeighbors(cat);
    const i = list.indexOf(cat);
    if (i === -1 || i >= list.length - 1) return;
    swapCategories(cat, list[i + 1]);
  }

  function moveCategoryToTop(cat) {
    const list = categoryNeighbors(cat);
    if (list.length === 0 || list[0] === cat) return;
    const idx = state.categories.indexOf(cat);
    if (idx === -1) return;
    state.categories.splice(idx, 1);
    const firstIdx = state.categories.indexOf(list[0]);
    state.categories.splice(firstIdx, 0, cat);
    save();
  }

  // ---- Organize-categories sheet ----
  // Restore-only: creating and editing active categories now live in the category edit
  // sheet (the "⋮" menu button on a category bar, or the main screen's "+ New Category"
  // button), so this sheet's one job is surfacing archived categories to bring back.
  function openCatSheet() {
    renderCatList();
    catBackdrop.classList.add("open");
    catSheet.classList.add("open");
  }

  function closeCatSheet() {
    catSheet.classList.remove("open");
    catBackdrop.classList.remove("open");
    render(); // reflect any restored categories on the main list
  }

  // ---- About sheet ----
  function openAboutSheet() {
    aboutVersionEl.textContent = "v" + APP_VERSION;
    aboutUpdatedEl.textContent = APP_UPDATED;
    aboutBackdrop.classList.add("open");
    aboutSheet.classList.add("open");
  }

  function closeAboutSheet() {
    aboutSheet.classList.remove("open");
    aboutBackdrop.classList.remove("open");
  }

  function renderCatList() {
    catList.innerHTML = "";
    const archivedCats = state.categories.filter(function (c) { return isArchived(c); });

    if (archivedCats.length === 0) {
      const em = document.createElement("div");
      em.className = "sec-empty";
      em.textContent = "No archived categories.";
      catList.appendChild(em);
      return;
    }

    archivedCats.forEach(function (cat) {
      const row = document.createElement("div");
      row.className = "cat-row archived";

      const name = document.createElement("span");
      name.className = "cat-name-static";
      name.textContent = cat;

      const restoreBtn = document.createElement("button");
      restoreBtn.className = "cat-restore-btn";
      restoreBtn.textContent = "Restore";
      restoreBtn.onclick = function () { restoreFromCatSheet(cat); };

      row.append(name, restoreBtn);
      catList.appendChild(row);
    });
  }

  // Shared by the category edit sheet's Delete button (confirmAndDeleteCategory is the
  // only caller now that the Organize sheet no longer lists active categories): confirms
  // (with a task count if any), then deletes. Returns whether it happened.
  function confirmAndDeleteCategory(cat) {
    if (state.categories.length === 1) { showToast("Keep at least one category"); return false; }
    const n = (state.tasks[cat] || []).length;
    const msg = n > 0
      ? 'Delete "' + cat + '" and its ' + n + ' task' + (n === 1 ? "" : "s") + "?"
      : 'Delete "' + cat + '"?';
    if (!confirm(msg)) return false;
    const res = deleteCategory(cat);
    if (res !== true) { showToast(res); return false; }
    return true;
  }

  function restoreFromCatSheet(cat) {
    const res = restoreCategory(cat);
    if (res !== true) { showToast(res); return; }
    renderCatList();
    showToast('"' + cat + '" restored');
  }

  // ---- Category edit sheet ----
  // Opened either by a category bar's "⋮" button on the main page (editing a real
  // category) or the main screen's "+ New Category" button (creating one — see
  // openCategoryCreateSheet). Everything here applies immediately (rename/create on
  // blur/Enter, tag/move/archive on tap) — no Save button, matching the old Organize
  // sheet row's behavior. `catEditCat` tracks the name currently committed: null while
  // a new category is still just being typed, so commitCategoryEditName() knows
  // whether the field means "create" or "rename".
  let catEditCat = null;
  // True only for the "+ New" flow: Order/Delete/Archive don't apply to a category that
  // doesn't exist yet (or, once created, wouldn't have had a *previous* position or archive
  // history) — renderCategoryEditSheet() keeps them hidden for the sheet's whole lifetime.
  let catEditIsNew = false;
  // Pending Home/Work selection for a not-yet-created category — there's no real category
  // to write categoryTags against until the name is actually committed. Defaults to the
  // active mode, so the new category lands where you're already looking.
  let catCreateTag = "work";

  function openCategoryEditSheet(cat) {
    catEditIsNew = false;
    catEditCat = cat;
    renderCategoryEditSheet();
    catEditBackdrop.classList.add("open");
    catEditSheet.classList.add("open");
  }

  function openCategoryCreateSheet() {
    catEditIsNew = true;
    catEditCat = null;
    catCreateTag = viewMode;
    renderCategoryEditSheet();
    catEditBackdrop.classList.add("open");
    catEditSheet.classList.add("open");
    // focus the name field once the sheet has slid up, matching the task sheet's own open
    setTimeout(function () { catEditName.focus(); }, 260);
  }

  function closeCategoryEditSheet() {
    // Same reason the task sheet's closeSheet() blurs its fields: a backdrop tap blurs
    // the name field for free, but saving from the keyboard's Return/checkmark key
    // closes the sheet programmatically, and iOS keeps its keyboard up if focus never
    // moved. Blurred first, while catEditCat still names the committed category — the
    // blur handler's own commit is then a no-op rather than a rename against null.
    catEditName.blur();
    catEditSheet.classList.remove("open");
    catEditBackdrop.classList.remove("open");
    catEditCat = null;
    catEditIsNew = false;
    render();
  }

  function renderCategoryEditSheet() {
    const cat = catEditCat;

    catEditOrderField.style.display = catEditIsNew ? "none" : "";
    catEditFinalizeField.style.display = catEditIsNew ? "none" : "";
    catEditName.placeholder = catEditIsNew ? "New category name" : "";
    catEditSaveBtn.textContent = catEditIsNew ? "Add category" : "Save category";
    catEditName.value = cat || "";

    catEditTypeChips.innerHTML = "";
    ["home", "work"].forEach(function (tag) {
      const chip = document.createElement("button");
      const selected = cat ? tagOf(cat) === tag : catCreateTag === tag;
      chip.className = "chip" + (selected ? " selected" : "");
      chip.textContent = tag === "home" ? "Home" : "Work";
      // Reads catEditCat live rather than closing over `cat`: tapping a chip fires
      // mousedown first, which blurs the name field and can create/rename the category
      // — including rebuilding these very chip elements — before this click handler
      // runs. A captured `cat` would still be null (or a stale old name) at that point.
      chip.onclick = function () {
        if (catEditCat) {
          if (tagOf(catEditCat) !== tag) toggleCategoryTag(catEditCat);
        } else {
          catCreateTag = tag;
        }
        renderCategoryEditSheet();
      };
      catEditTypeChips.appendChild(chip);
    });

    if (catEditIsNew) return;

    const neighbors = categoryNeighbors(cat);
    const idx = neighbors.indexOf(cat);
    catEditMoveUp.disabled = idx <= 0;
    catEditMoveDown.disabled = idx === -1 || idx >= neighbors.length - 1;
    catEditMoveTop.disabled = idx <= 0;
  }

  // Returns true when the name is committed (created, renamed, or already current),
  // false when it isn't — the Save button uses that to decide whether to close.
  function commitCategoryEditName() {
    const cat = catEditCat;
    const next = catEditName.value.trim();

    if (!cat) {
      // Nothing created yet — this field IS the create flow, not a rename. A blur with
      // nothing typed is just the user tapping elsewhere, not an error, so it stays
      // silent here; only the Save button complains about an empty name.
      if (!next) return false;
      const res = createCategory(next);
      if (res !== true) { showToast(res); return false; }
      if (catCreateTag === "home") { state.categoryTags[next] = "home"; save(); }
      catEditCat = next;
      // Deliberately no renderCategoryEditSheet() here: this runs inside a blur handler
      // fired by mousedown on, say, the Type chip the user is mid-tap on. Rebuilding that
      // chip's DOM out from under the same gesture can drop the click that triggered the
      // blur in the first place. The chip's own onclick reads catEditCat live, so the
      // existing (unrebuilt) elements already handle the just-created category correctly.
      return true;
    }

    if (next === cat) { catEditName.value = cat; return true; }
    const res = renameCategory(cat, next);
    if (res !== true) { showToast(res); catEditName.value = cat; return false; }
    catEditCat = next;
    return true;
  }

  // The sheet's one commit-and-close action, shared by the Save button and the name
  // field's Enter key. Type/Order/Archive/Delete all apply live, so the only work here
  // is the name. A tap on Save blurs the name field on mousedown first, so the
  // create/rename has usually already run by the time this is called — re-running it is
  // a no-op once the committed name matches the field — and calling it explicitly is
  // what makes the Enter path (no blur of its own) commit at all.
  function saveCategorySheet() {
    if (!commitCategoryEditName()) {
      // createCategory/renameCategory toast their own failures; the one silent case is
      // an empty name in the create flow, which only this action needs to complain about.
      if (!catEditCat) showToast("Enter a name");
      return;
    }
    closeCategoryEditSheet();
  }

  // ---- Render: dispatch to the active screen ----
  // The dispatcher owns everything the screens share — nav button states, the
  // palette stamp (work mode goes cold steel; Home and "no palette" both fall
  // back to the :root gold), the status-bar colour, FAB visibility — then
  // hands the scroll area to the active screen's renderer.
  function render() {
    NAV.forEach(function (entry) {
      const b = navButtons[entry.id];
      const on = entry.isActive();
      b.classList.toggle("active", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
    const scr = SCREENS[screen];
    const pal = scr.palette ? scr.palette() : null;
    if (pal) document.documentElement.setAttribute("data-mode", pal);
    else document.documentElement.removeAttribute("data-mode");
    const tc = document.getElementById("theme-color");
    if (tc) tc.setAttribute("content", BAR_COLORS[pal] || BAR_COLORS.default);
    scr.render();
  }

  // ---- Todos screen: one collapsible section per category ----
  // Muted entry point for creating a category, sitting at the bottom of whatever the
  // scroll area shows — the category list, or one of the empty-state messages below.
  // Always present so there's still a way to add a category from a fully empty state.
  function renderAddCategoryButton() {
    const btn = document.createElement("button");
    btn.className = "add-cat-btn";
    btn.textContent = "＋ New Category";
    btn.onclick = function () { openCategoryCreateSheet(); };
    scroll.appendChild(btn);
  }
