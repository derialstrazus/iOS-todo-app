  // Scheduled tasks across every category in the current mode, soonest first, as
  // one collapsible section below the categories. Deliberately not inline in each
  // category: a scheduled task isn't actionable today, and the day's list is what
  // the main screen is for. Skipped entirely when empty rather than showing an
  // empty section. Recurring tasks will surface here too when they land.
  function renderScheduledSection() {
    const items = pendingFor(viewMode);
    if (!items.length) return;

    const isCollapsed = !!collapsed[SCHEDULED_KEY];
    const section = document.createElement("div");
    section.className = "section section-sched" + (isCollapsed ? " collapsed" : "");

    const head = document.createElement("div");
    head.className = "sec-head";

    const caret = document.createElement("span");
    caret.className = "sec-caret";
    caret.innerHTML = '<svg viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><path d="M1 3.5h10L6 9.5z"/></svg>';

    const title = document.createElement("span");
    title.className = "sec-title";
    title.textContent = "Scheduled";

    head.append(caret, title);
    head.onclick = function () {
      collapsed[SCHEDULED_KEY] = !collapsed[SCHEDULED_KEY];
      saveCollapsed();
      section.classList.toggle("collapsed");
    };
    section.appendChild(head);

    const body = document.createElement("div");
    body.className = "sec-body";

    items.forEach(function (it) {
      const p = it.entry;
      const li = document.createElement("li");
      li.className = "sched";

      // Where a task row carries its checkbox: nothing to complete yet. A clock for a
      // one-shot, a cycle arrow for a repeat — the two behave differently once they
      // fire, so they shouldn't look identical while they wait.
      const icon = document.createElement("div");
      icon.className = "sched-icon";
      icon.innerHTML = p.repeat
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M20.5 3v6h-6"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
      icon.setAttribute("aria-label", p.repeat ? "Repeats" : "Scheduled");

      const label = document.createElement("div");
      label.className = "label";
      label.onclick = (function (idx) {
        return function () { openEditPending(idx); };
      })(it.index);

      const labelText = document.createElement("div");
      labelText.className = "label-text";
      labelText.textContent = p.text;

      const labelWhen = document.createElement("div");
      labelWhen.className = "label-when";
      labelWhen.textContent = pendingWhenLine(p);

      label.append(labelText, labelWhen);
      li.append(icon, label);

      const tagDef = tagById(p.tag);
      if (tagDef) {
        const badge = document.createElement("span");
        badge.className = "tag-icon tag-" + tagDef.id;
        badge.textContent = tagDef.short;
        badge.setAttribute("aria-label", tagDef.label);
        badge.title = tagDef.label;
        li.appendChild(badge);
      }

      body.appendChild(li);
    });

    section.appendChild(body);
    scroll.appendChild(section);
  }

  function renderTodoList() {
    scroll.innerHTML = "";

    if (state.categories.length === 0) {
      const p = document.createElement("div");
      p.className = "empty-all";
      p.innerHTML = "No categories yet.<br>Add one below.";
      scroll.appendChild(p);
      renderAddCategoryButton();
      return;
    }

    const shown = displayCategories();
    // Every category can legitimately sit in the other mode, and the filter hides them,
    // so say why the screen is blank rather than showing nothing at all.
    if (shown.length === 0) {
      const p = document.createElement("div");
      p.className = "empty-all";
      p.innerHTML = "Nothing in " + (viewMode === "home" ? "Home" : "Work") +
        ".<br>Switch a category's type from its edit sheet to bring one over.";
      scroll.appendChild(p);
      // Still shown here: every category in this mode can be archived while a
      // scheduled task for one of them is waiting, and it needs to stay reachable.
      renderScheduledSection();
      renderAddCategoryButton();
      return;
    }

    shown.forEach(function (cat) {
      const tasks = state.tasks[cat] || [];
      const isCollapsed = !!collapsed[cat];

      const section = document.createElement("div");
      section.className = "section" + (isCollapsed ? " collapsed" : "") + " tag-" + tagOf(cat);

      // Header: tapping the bar toggles collapse; the menu button opens the
      // category edit sheet (rename, type, archive, delete, reorder).
      const head = document.createElement("div");
      head.className = "sec-head";

      const caret = document.createElement("span");
      caret.className = "sec-caret";
      caret.innerHTML = '<svg viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><path d="M1 3.5h10L6 9.5z"/></svg>';

      const title = document.createElement("span");
      title.className = "sec-title";
      title.textContent = cat;

      const menuBtn = document.createElement("button");
      menuBtn.className = "sec-menu";
      menuBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>';
      menuBtn.setAttribute("aria-label", "Edit " + cat);
      menuBtn.onclick = function (e) {
        e.stopPropagation();
        openCategoryEditSheet(cat);
      };

      const addBtn = document.createElement("button");
      addBtn.className = "sec-add";
      addBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
      addBtn.setAttribute("aria-label", "Add task to " + cat);
      addBtn.onclick = function (e) {
        e.stopPropagation();
        openCreate(cat);
      };

      head.append(caret, title, menuBtn, addBtn);

      head.onclick = function () {
        collapsed[cat] = !collapsed[cat];
        saveCollapsed();
        section.classList.toggle("collapsed");
      };

      section.appendChild(head);

      // Body
      const body = document.createElement("div");
      body.className = "sec-body";

      if (tasks.length === 0) {
        const em = document.createElement("div");
        em.className = "sec-empty";
        em.textContent = "No tasks yet.";
        body.appendChild(em);
      } else {
        tasks.forEach(function (t, i) {
          const li = document.createElement("li");
          if (t.done) li.className = "done";
          li.dataset.index = i;
          li.dataset.cat = cat;

          const handle = document.createElement("div");
          handle.className = "handle";
          handle.textContent = "\u2261";

          const check = document.createElement("div");
          check.className = "check";
          check.onclick = function () {
            tasks[i].done = !tasks[i].done;
            tasks[i].completedAt = tasks[i].done ? new Date().toISOString() : null;
            save(); render();
          };

          const label = document.createElement("div");
          label.className = "label";
          label.onclick = (function (c, idx) {
            return function () { openEdit(c, idx); };
          })(cat, i);

          const labelText = document.createElement("div");
          labelText.className = "label-text";
          labelText.textContent = t.text;
          label.appendChild(labelText);

          if (t.comment) {
            const labelComment = document.createElement("div");
            labelComment.className = "label-comment";
            labelComment.textContent = t.comment;
            label.appendChild(labelComment);
          }

          li.append(handle, check, label);

          // Tag badge (display only; ordering handled in a later step)
          const tagDef = tagById(t.tag);
          if (tagDef) {
            const badge = document.createElement("span");
            badge.className = "tag-icon tag-" + tagDef.id;
            badge.textContent = tagDef.short;
            badge.setAttribute("aria-label", tagDef.label);
            badge.title = tagDef.label;
            li.appendChild(badge);
          }

          attachDrag(li, handle, cat, i);
          body.appendChild(li);
        });
      }

      section.appendChild(body);
      scroll.appendChild(section);
    });

    renderScheduledSection();
    renderAddCategoryButton();
  }

  // ---- Archive screen ----
  // Read-only history. Everything archiveDone() / archiveCategory() sweeps out of
  // `state` lands in the `archive` array (see ARCHIVE_KEY), which until now was
  // write-only — a JSON export was the only way to read it back.
  //
  // Two groupings, switched by the chips at the top of the screen, each sorted
  // newest-first inside a group:
  //   by category — what a project got through. Work categories come first in
  //                 steel, then Home in gold: the same fixed --work/--home hues
  //                 the two modes wear, so a group's colour says which side of
  //                 life it came from without spending a row on saying it.
  //   by date     — what got finished on a given day, which is the view for "what
  //                 did I actually do this week".
  //
  // Deliberately NOT filtered by viewMode. The plan floated reusing the mode as a
  // filter here, but the by-category view showing both tags at once is the whole
  // point of colouring them, and history reads as a whole rather than through the
  // day's Home/Work lens. Work and Home in the top bar therefore take you back to
  // the todos screen rather than filtering this one.
  //
  // Nothing here is editable: no restore-to-list, no delete. The archive is the
  // record of what happened, and "Archive done" is the only thing that writes it.
  const ARCHIVE_VIEW_KEY = "todos.v2.archiveView";
  const ARCHIVE_OPEN_KEY = "todos.v2.archiveOpen";
  // Rows built per render, across every open group. Groups start collapsed and a
  // collapsed group builds nothing, which is most of the protection: the todos
  // screen can afford to build every row and hide the collapsed ones in CSS, but
  // the archive is allowed to reach ARCHIVE_THRESHOLD (5000) entries. This is the
  // backstop for the rest — one screen-wide budget rather than a per-group cap,
  // because the problem case is many open groups (a year of daily archiving is
  // ~365 date groups) as much as one enormous one. Groups past the budget still
  // show their bar and count; they just don't build rows until something above
  // them is collapsed or a search narrows things.
  const ARCHIVE_ROW_BUDGET = 600;

  // "cat" | "date", guarded like every other loader — see loadViewMode's comment.
  let archiveView = loadArchiveView();
  // Group key → open flag. Three states, and the third matters: absent means
  // "never touched", which reads as collapsed normally but as OPEN while a search
  // is running (answering a query with a screen of shut bars would be useless).
  // An explicit false is therefore how a group stays shut during a search.
  let archiveOpen = loadArchiveOpen();
  // Not persisted: a search is a moment, not a setting. Coming back to the screen
  // tomorrow with a stale filter still applied would look like data loss.
  let archiveQuery = "";
  // The two grouping chips, kept so a re-render can re-sync their selected state
  // without rebuilding the bar they live in (see buildArchiveBar).
  const archViewChips = {};

  function loadArchiveView() {
    try {
      const v = localStorage.getItem(ARCHIVE_VIEW_KEY);
      if (v === "cat" || v === "date") return v;
    } catch (e) {}
    return "cat";
  }
  function saveArchiveView() {
    try { localStorage.setItem(ARCHIVE_VIEW_KEY, archiveView); } catch (e) {}
  }
  function loadArchiveOpen() {
    try {
      const o = JSON.parse(localStorage.getItem(ARCHIVE_OPEN_KEY));
      if (o && typeof o === "object") return o;
    } catch (e) {}
    return {};
  }
  function saveArchiveOpen() {
    try { localStorage.setItem(ARCHIVE_OPEN_KEY, JSON.stringify(archiveOpen)); } catch (e) {}
  }

  // When a task finished. completedAt is the honest answer; archivedAt covers
  // entries swept in before completedAt was stamped, and createdAt is the last
  // resort. Compared as strings elsewhere, which is safe: they're all ISO.
  function archiveStamp(e) {
    return e.completedAt || e.archivedAt || e.createdAt || "";
  }

  // Local calendar day of a stamp, "YYYY-MM-DD" — the by-date grouping key. Built
  // from the local getters rather than by slicing the ISO string, which would group
  // by UTC day and file a 01:00 completion under the day before.
  function dayKey(iso) {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    const m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (day < 10 ? "0" : "") + day;
  }

  // "Today" / "Yesterday" / "Fri, 21 Aug 2026". The near days get named for the
  // same reason formatWhen names them, and the year is spelled out because the
  // archive is the one place in the app whose list spans years.
  function dayLabel(key) {
    const parts = /^(\d{4})-(\d{2})-(\d{2})$/.exec(key || "");
    if (!parts) return "Undated";
    const d = new Date(+parts[1], +parts[2] - 1, +parts[3]);
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const days = Math.round((d - today) / 86400000);
    if (days === 0) return "Today";
    if (days === -1) return "Yesterday";
    return d.toLocaleDateString([], { weekday: "short", day: "numeric", month: "short", year: "numeric" });
  }

  // The second line of a row. Each view names what its own grouping doesn't
  // already say: rows in a category group carry their date, rows in a date group
  // carry their category.
  function archiveLine(e) {
    const stamp = archiveStamp(e);
    const time = timeOf(stamp);
    if (archiveView === "date") {
      return (time ? time + " · " : "") + (e.category || "No category");
    }
    if (!stamp) return "Undated";
    return dayLabel(dayKey(stamp)) + (time ? ", " + time : "");
  }

  // Search covers the three things an entry says: its text, its comment, and the
  // category it came from — the last so "project a" finds a whole project's
  // history in the date view too.
  function archiveMatches(e, q) {
    if (!q) return true;
    return (e.text || "").toLowerCase().indexOf(q) !== -1
      || (e.comment || "").toLowerCase().indexOf(q) !== -1
      || (e.category || "").toLowerCase().indexOf(q) !== -1;
  }

  // Grouped entries for the active view: [{ key, label, tag, items }] in display
  // order, items newest-first. `tag` is null for a date group, which has no
  // category hue to wear. Keys are view-prefixed so the two views keep separate
  // collapse state — a category and a date can't collide.
  function archiveGroups() {
    const q = archiveQuery.trim().toLowerCase();
    const byDate = archiveView === "date";
    const map = {};
    const keys = [];
    archive.forEach(function (e) {
      if (!archiveMatches(e, q)) return;
      const key = byDate ? dayKey(archiveStamp(e)) : (e.category || "");
      if (!map[key]) { map[key] = []; keys.push(key); }
      map[key].push(e);
    });
    keys.forEach(function (k) {
      map[k].sort(function (a, b) { return archiveStamp(b).localeCompare(archiveStamp(a)); });
    });

    if (byDate) {
      // Newest day first. Entries with no usable stamp at all group under "" and
      // sort to the end, which is where an undated straggler belongs.
      keys.sort(function (a, b) { return (b || "").localeCompare(a || ""); });
      return keys.map(function (k) {
        return { key: "date:" + k, label: dayLabel(k), tag: null, items: map[k] };
      });
    }

    // Work first, then Home — the requirement the two hues exist to serve. Within
    // a tag, most recently active category first: map[k] is already sorted
    // newest-first, so its head entry IS that category's latest stamp. This
    // replaces the saved category order, which said nothing about the archive — a
    // project finished last year sat above one still being worked purely because of
    // where it happens to sit on the main screen. It also files the archive-only
    // categories (deleted since, so absent from state.categories) by the same rule
    // as the rest, instead of dumping them alphabetically at the end of their tag.
    // tagOf() resolves a category the tag map has never heard of to "work", the
    // same fallback that keeps legacy untagged categories reachable on the main
    // screen — so an orphan lands under Work.
    //
    // A category whose entries all lack a usable stamp compares as "" and sinks to
    // the end of its tag, where name order breaks the tie. Note the ordering is
    // over the *filtered* entries, so searching re-sorts by most recent match —
    // which is the same question the unfiltered list is answering.
    const recent = function (c) { return map[c].length ? archiveStamp(map[c][0]) : ""; };
    keys.sort(function (a, b) {
      const ta = tagOf(a) === "work" ? 0 : 1;
      const tb = tagOf(b) === "work" ? 0 : 1;
      if (ta !== tb) return ta - tb;
      const ra = recent(a), rb = recent(b);
      if (ra !== rb) return rb.localeCompare(ra);
      return a.localeCompare(b);
    });
    return keys.map(function (k) {
      return { key: "cat:" + k, label: k || "No category", tag: tagOf(k), items: map[k] };
    });
  }

  // The grouping toggle and the search box. Built once per visit to the screen and
  // then left in place: renderArchive() rebuilds only the group list below it, so
  // typing never detaches the focused input.
  function buildArchiveBar() {
    const bar = document.createElement("div");
    bar.className = "arch-bar";

    const chips = document.createElement("div");
    chips.className = "chips";
    [{ id: "cat", label: "By category" }, { id: "date", label: "By date" }].forEach(function (v) {
      const chip = document.createElement("button");
      chip.className = "chip";
      chip.textContent = v.label;
      chip.onclick = function () {
        if (archiveView === v.id) return;
        archiveView = v.id;
        saveArchiveView();
        renderArchive();
        scroll.scrollTop = 0;
      };
      archViewChips[v.id] = chip;
      chips.appendChild(chip);
    });

    const search = document.createElement("input");
    search.type = "search";
    search.className = "arch-search";
    search.placeholder = "Search archived tasks";
    search.value = archiveQuery;
    search.autocomplete = "off";
    search.setAttribute("enterkeyhint", "search");
    search.addEventListener("input", function () {
      archiveQuery = search.value;
      renderArchive();
    });

    bar.append(chips, search);
    return bar;
  }

  // One group's rows, up to whatever's left of the render's row budget. Returns
  // the body and how many rows it built, so the caller can keep the tally.
  function archiveGroupBody(g, allowance) {
    const body = document.createElement("div");
    body.className = "sec-body";
    const built = Math.min(g.items.length, Math.max(0, allowance));
    for (let i = 0; i < built; i++) body.appendChild(archiveRow(g.items[i]));
    if (built < g.items.length) {
      const more = document.createElement("div");
      more.className = "arch-more";
      // Two different situations: this group ran the budget out partway through, or
      // it never got any of it because the groups above used it up.
      more.textContent = built
        ? (g.items.length - built) + " more not shown — search to narrow"
        : g.items.length + " rows past this screen's limit — collapse a group above";
      body.appendChild(more);
    }
    return { body: body, built: built };
  }

  // Row: the task slab minus its checkbox and drag handle, like a Scheduled row —
  // there's nothing left to complete or reorder. A tick where those sat, the task's
  // text, its comment if it kept one, and whichever of date/category the group
  // isn't already saying.
  function archiveRow(e) {
    const li = document.createElement("li");
    li.className = "arch";

    const icon = document.createElement("div");
    icon.className = "arch-icon";
    icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5 9.5 18 20 6"/></svg>';
    icon.setAttribute("aria-label", "Completed");

    const label = document.createElement("div");
    label.className = "label";

    const text = document.createElement("div");
    text.className = "label-text";
    text.textContent = e.text || "(untitled)";
    label.appendChild(text);

    // Entries archived before the sweep carried comments through simply have none.
    if (e.comment) {
      const comment = document.createElement("div");
      comment.className = "label-comment";
      comment.textContent = e.comment;
      label.appendChild(comment);
    }

    const when = document.createElement("div");
    when.className = "label-when";
    when.textContent = archiveLine(e);
    label.appendChild(when);

    // No tag badge, deliberately: PRIO/WAIT/QUICK say how to handle a task that is
    // still ahead of you, and nothing here is. The tag stays on the entry (backups
    // keep it, and a row is never rewritten) — it just isn't drawn.
    li.append(icon, label);
    return li;
  }

  function renderArchive() {
    // Reuse the bar when it's already on screen — a re-render from typing, from
    // switching view, or from opening a group. It only gets rebuilt on arrival from
    // another screen, whose renderer cleared the scroll area on its way out.
    let groups = document.getElementById("arch-groups");
    if (!groups) {
      scroll.innerHTML = "";
      scroll.appendChild(buildArchiveBar());
      groups = document.createElement("div");
      groups.id = "arch-groups";
      scroll.appendChild(groups);
    }
    Object.keys(archViewChips).forEach(function (id) {
      archViewChips[id].classList.toggle("selected", archiveView === id);
    });
    groups.innerHTML = "";

    if (!archive.length) {
      const empty = document.createElement("div");
      empty.className = "empty-all";
      empty.innerHTML = "Nothing archived yet.<br>Completed tasks land here from the menu's \u201cArchive done\u201d.";
      groups.appendChild(empty);
      return;
    }

    const list = archiveGroups();
    const searching = !!archiveQuery.trim();
    if (!list.length) {
      const empty = document.createElement("div");
      empty.className = "empty-all";
      empty.textContent = "No archived task matches that.";
      groups.appendChild(empty);
      return;
    }

    let total = 0;
    list.forEach(function (g) { total += g.items.length; });
    const summary = document.createElement("div");
    summary.className = "arch-summary";
    summary.textContent = total + (searching ? " match" + (total === 1 ? "" : "es") : " archived task" + (total === 1 ? "" : "s")) +
      " · " + list.length + (archiveView === "date" ? " day" + (list.length === 1 ? "" : "s") : " categor" + (list.length === 1 ? "y" : "ies"));
    groups.appendChild(summary);

    let budget = ARCHIVE_ROW_BUDGET;
    list.forEach(function (g) {
      // Absent reads as collapsed normally and as open while searching; an explicit
      // false is a group the user shut. Toggling writes the opposite of whatever is
      // on screen, so the tap does what it looks like it does in both cases.
      const saved = archiveOpen[g.key];
      const open = saved === undefined ? searching : !!saved;

      const section = document.createElement("div");
      section.className = "section arch-group" + (open ? "" : " collapsed") +
        (g.tag ? " tag-" + g.tag : " by-date");

      const head = document.createElement("div");
      head.className = "sec-head";

      const caret = document.createElement("span");
      caret.className = "sec-caret";
      caret.innerHTML = '<svg viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><path d="M1 3.5h10L6 9.5z"/></svg>';

      const title = document.createElement("span");
      title.className = "sec-title";
      title.textContent = g.label;

      const count = document.createElement("span");
      count.className = "sec-count";
      count.textContent = g.items.length;

      head.append(caret, title, count);
      // Re-renders rather than toggling a class the way the todos screen does: a
      // collapsed group's rows were never built, so opening one has to build them.
      head.onclick = function () {
        archiveOpen[g.key] = !open;
        saveArchiveOpen();
        renderArchive();
      };
      section.appendChild(head);

      if (open) {
        const res = archiveGroupBody(g, budget);
        budget -= res.built;
        section.appendChild(res.body);
      }
      groups.appendChild(section);
    });
  }

  // ---- Touch + mouse drag reordering, scoped to a single category ----
  let dragIndex = null;
  let dragCat = null;
  function attachDrag(li, handle, cat, index) {
    function siblings() {
      // Only LI nodes within the same section body as `li`
      return Array.prototype.slice.call(li.parentNode.children).filter(function (n) { return n.tagName === "LI"; });
    }
    function start() {
      dragIndex = index;
      dragCat = cat;
      li.classList.add("dragging");
    }
    function move(clientY) {
      if (dragIndex === null) return;
      const items = siblings();
      let target = null;
      items.forEach(function (it) {
        const r = it.getBoundingClientRect();
        if (clientY > r.top && clientY < r.bottom) target = it;
      });
      items.forEach(function (it) { it.classList.remove("drag-over"); });
      if (target && target !== li) target.classList.add("drag-over");
    }
    function end(clientY) {
      if (dragIndex === null) return;
      const items = siblings();
      let toIndex = dragIndex;
      items.forEach(function (it) {
        const r = it.getBoundingClientRect();
        if (clientY > r.top && clientY < r.bottom) toIndex = parseInt(it.dataset.index, 10);
      });
      const tasks = state.tasks[dragCat] || [];
      if (toIndex !== dragIndex && toIndex >= 0 && toIndex < tasks.length) {
        const moved = tasks.splice(dragIndex, 1)[0];
        tasks.splice(toIndex, 0, moved);
        save();
      }
      dragIndex = null;
      dragCat = null;
      render();
    }

    handle.addEventListener("touchstart", function (e) {
      start();
    }, { passive: true });
    handle.addEventListener("touchmove", function (e) {
      e.preventDefault();
      move(e.touches[0].clientY);
    }, { passive: false });
    handle.addEventListener("touchend", function (e) {
      end(e.changedTouches[0].clientY);
    });

    // mouse fallback for desktop testing
    handle.addEventListener("mousedown", function (e) {
      start();
      function mm(ev) { move(ev.clientY); }
      function mu(ev) { end(ev.clientY); document.removeEventListener("mousemove", mm); document.removeEventListener("mouseup", mu); }
      document.addEventListener("mousemove", mm);
      document.addEventListener("mouseup", mu);
    });
  }

  // ---- Bottom-sheet create / edit ----
  // Renders the tag chip picker based on the current sheetCtx selection. Category isn't
  // pickable here — a task's category is fixed by which category's "+" opened the sheet
  // (create) or where it already lives (edit).
  function renderSheetTagChips() {
    sheetTags.innerHTML = "";
    // "None" option first, then the three tags
    const none = document.createElement("button");
    none.className = "chip" + (!sheetCtx.tag ? " selected" : "");
    none.textContent = "None";
    none.onclick = function () { sheetCtx.tag = null; renderSheetTagChips(); };
    sheetTags.appendChild(none);
    TAGS.forEach(function (t) {
      const chip = document.createElement("button");
      chip.className = "chip" + (sheetCtx.tag === t.id ? " selected" : "");
      chip.textContent = t.label;
      chip.setAttribute("aria-label", t.label);
      chip.onclick = function () { sheetCtx.tag = t.id; renderSheetTagChips(); };
      sheetTags.appendChild(chip);
    });
  }

  // datetime-local speaks local wall-clock time with no zone ("2026-08-25T08:00"),
  // while everything stored is ISO/UTC — these two convert between them.
  function toLocalInput(iso) {
    const d = new Date(iso);
    const p2 = function (n) { return String(n).padStart(2, "0"); };
    return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()) +
      "T" + p2(d.getHours()) + ":" + p2(d.getMinutes());
  }
  function fromLocalInput(v) {
    const d = v ? new Date(v) : null; // no zone suffix: parsed as local time
    return d && !isNaN(d.getTime()) ? d.toISOString() : null;
  }
  // Tomorrow morning — the common case for a commute app is "deal with this
  // tomorrow", and it beats defaulting to a time that's already passed.
  function defaultWhen() {
    const d = new Date();
    d.setDate(d.getDate() + 1);
    d.setHours(8, 0, 0, 0);
    return d.toISOString();
  }

  // The sheet's repeat options. `build` turns an option into a stored pattern,
  // taking weekly's weekday and monthly's day-of-month from the first occurrence —
  // that's why the sheet needs no sub-pickers. `label` names the option in terms of
  // that same date, so "Weekly" reads as "Weekly (Mon)" once a date is chosen.
  const REPEATS = [
    {
      id: "daily", label: function () { return "Every day"; },
      build: function () { return { kind: "days", n: 1 }; },
      matches: function (r) { return r.kind === "days" && (r.n || 1) === 1; }
    },
    {
      id: "every2", label: function () { return "Every 2 days"; },
      build: function () { return { kind: "days", n: 2 }; },
      matches: function (r) { return r.kind === "days" && r.n === 2; }
    },
    {
      id: "weekly",
      label: function (d) { return "Weekly (" + WEEKDAYS[d.getDay()].slice(0, 3) + ")"; },
      build: function (d) { return { kind: "weekly", weekday: d.getDay() }; },
      matches: function (r) { return r.kind === "weekly"; }
    },
    {
      id: "monthly",
      label: function (d) { return "Monthly (" + ordinal(d.getDate()) + ")"; },
      build: function (d) { return { kind: "monthly", day: d.getDate() }; },
      matches: function (r) { return r.kind === "monthly"; }
    }
  ];

  function repeatById(id) {
    for (let i = 0; i < REPEATS.length; i++) if (REPEATS[i].id === id) return REPEATS[i];
    return null;
  }
  function repeatKindId(r) {
    if (!r) return null;
    for (let i = 0; i < REPEATS.length; i++) if (REPEATS[i].matches(r)) return REPEATS[i].id;
    return null;
  }
  // Pattern from the sheet's state. Rebuilt on every save, so editing the first
  // occurrence to a Thursday moves a weekly task to Thursdays with it.
  function buildRepeat(kindId, whenIso, until) {
    const def = repeatById(kindId);
    if (!def) return null;
    const r = def.build(new Date(whenIso));
    r.until = until || null;
    return r;
  }

  function renderSheetRepeatChips() {
    sheetRepeatChips.innerHTML = "";
    const anchor = new Date(sheetCtx.when || Date.now());

    const none = document.createElement("button");
    none.className = "chip" + (!sheetCtx.repeatKind ? " selected" : "");
    none.textContent = "Once";
    none.onclick = function () { setSheetRepeat(null); };
    sheetRepeatChips.appendChild(none);

    REPEATS.forEach(function (def) {
      const chip = document.createElement("button");
      chip.className = "chip" + (sheetCtx.repeatKind === def.id ? " selected" : "");
      chip.textContent = def.label(anchor);
      chip.onclick = function () { setSheetRepeat(def.id); };
      sheetRepeatChips.appendChild(chip);
    });

    // Nothing to bound when it only happens once.
    sheetUntilField.style.display = sheetCtx.repeatKind ? "" : "none";
    sheetUntilInput.value = sheetCtx.until || "";
    // Guidance only. An `until` before the first occurrence isn't a dead end — the
    // first one still fires and the pattern is simply spent, so there's nothing to
    // validate against.
    if (sheetCtx.when) sheetUntilInput.min = toLocalInput(sheetCtx.when).slice(0, 10);
  }

  function setSheetRepeat(kindId) {
    sheetCtx.repeatKind = kindId;
    if (!kindId) sheetCtx.until = null;
    renderSheetRepeatChips();
    updateSaveEnabled(); // the Save button names the repeat, so it restates too
  }

  function renderSheetWhenChips() {
    sheetWhenChips.innerHTML = "";
    [["Now", false], ["Later", true]].forEach(function (opt) {
      const chip = document.createElement("button");
      chip.className = "chip" + (!!sheetCtx.later === opt[1] ? " selected" : "");
      chip.textContent = opt[0];
      chip.onclick = function () { setSheetLater(opt[1]); };
      sheetWhenChips.appendChild(chip);
    });
    sheetWhenInput.style.display = sheetCtx.later ? "" : "none";
    if (sheetCtx.later) {
      sheetWhenInput.min = toLocalInput(new Date().toISOString());
      sheetWhenInput.value = sheetCtx.when ? toLocalInput(sheetCtx.when) : "";
    }
    // A repeat needs a first occurrence to anchor to, so it rides with the picker.
    sheetRepeatField.style.display = sheetCtx.later ? "" : "none";
    if (sheetCtx.later) renderSheetRepeatChips();
    else sheetUntilField.style.display = "none";
  }

  function setSheetLater(later) {
    sheetCtx.later = later;
    if (later && !sheetCtx.when) sheetCtx.when = defaultWhen();
    if (!later) { sheetCtx.repeatKind = null; sheetCtx.until = null; }
    renderSheetWhenChips();
    updateSaveEnabled();
  }

  function updateSaveEnabled() {
    // Require a non-empty task, a category (no default), and — if Later is picked —
    // an actual date to go with it.
    const ok = sheetText.value.trim().length > 0 && !!sheetCtx && !!sheetCtx.cat &&
      (!sheetCtx.later || !!sheetCtx.when);
    sheetSave.disabled = !ok;
    sheetSave.textContent = sheetSaveLabel();
  }

  // The button says what the tap will actually do: scheduling something for later
  // isn't "adding" it, and clearing a scheduled task's date puts it in the list now.
  function sheetSaveLabel() {
    if (!sheetCtx) return "Add task";
    if (sheetCtx.mode === "create") {
      if (!sheetCtx.later) return "Add task";
      return sheetCtx.repeatKind ? "Schedule repeat" : "Schedule";
    }
    if (sheetCtx.mode === "pending") return sheetCtx.later ? "Save" : "Add now";
    return "Save";
  }

  function openSheet(ctx) {
    sheetCtx = ctx;
    sheetDelete.style.display = ctx.mode === "create" ? "none" : "";
    sheetWhenField.style.display = ctx.mode === "edit" ? "none" : "";
    sheetText.value = ctx.text || "";
    sheetComment.value = ctx.comment || "";
    renderSheetTagChips();
    renderSheetWhenChips(); // also draws Repeat/Until, which ride with the picker
    updateSaveEnabled();
    sheetBackdrop.classList.add("open");
    sheet.classList.add("open");
    // focus the text field once the sheet has slid up
    setTimeout(function () { sheetText.focus(); }, 260);
  }

  function closeSheet() {
    // Tapping the backdrop blurs the focused field for free, but saving via the
    // keyboard's Return/checkmark key closes the sheet programmatically without
    // ever blurring — iOS then leaves its keyboard up since focus never moved.
    sheetText.blur();
    sheetComment.blur();
    sheet.classList.remove("open");
    sheetBackdrop.classList.remove("open");
    sheetCtx = null;
  }

  function openCreate(cat) {
    openSheet({ mode: "create", cat: cat, tag: null, text: "", comment: "", later: false, when: null, repeatKind: null, until: null });
  }

  // Editing a scheduled task: same sheet, with When pre-set to its due date.
  function openEditPending(index) {
    const p = state.pending[index];
    if (!p) return;
    openSheet({
      mode: "pending",
      cat: p.cat,
      tag: p.tag || null,
      text: p.text,
      comment: p.comment || "",
      later: true,
      when: p.dueAt,
      repeatKind: repeatKindId(p.repeat),
      until: p.repeat ? (p.repeat.until || null) : null,
      pendingIndex: index
    });
  }

  function openEdit(cat, index) {
    const task = (state.tasks[cat] || [])[index];
    if (!task) return;
    openSheet({
      mode: "edit",
      cat: cat,
      tag: task.tag || null,
      text: task.text,
      comment: task.comment || "",
      taskCat: cat,
      taskIndex: index,
      later: false,
      when: null,
      repeatKind: null,
      until: null
    });
  }

  function deleteFromSheet() {
    if (!sheetCtx || sheetCtx.mode === "create") return;
    if (sheetCtx.mode === "pending") {
      state.pending.splice(sheetCtx.pendingIndex, 1);
      save();
      closeSheet();
      render();
      return;
    }
    const src = state.tasks[sheetCtx.taskCat] || [];
    if (src[sheetCtx.taskIndex]) src.splice(sheetCtx.taskIndex, 1);
    save();
    closeSheet();
    render();
  }

  function saveSheet() {
    if (!sheetCtx) return;
    const text = sheetText.value.trim();
    const comment = sheetComment.value.trim();
    const cat = sheetCtx.cat;
    if (!text || !cat) return;
    // A time that has already passed is treated as "now" rather than rejected —
    // the picker's `min` keeps it from happening, but a stale sheet left open
    // across midnight otherwise turns into a dead end.
    const dueAt = sheetCtx.later && sheetCtx.when && Date.parse(sheetCtx.when) > Date.now()
      ? sheetCtx.when : null;
    const repeat = dueAt ? buildRepeat(sheetCtx.repeatKind, dueAt, sheetCtx.until) : null;

    if (sheetCtx.mode === "pending") {
      const p = state.pending[sheetCtx.pendingIndex];
      if (p) {
        p.text = text;
        p.tag = sheetCtx.tag || null;
        p.comment = comment || null;
        if (dueAt) {
          p.dueAt = dueAt;
          p.repeat = repeat;
        } else {
          // Rescheduled to now: it stops waiting and joins the list.
          state.pending.splice(sheetCtx.pendingIndex, 1);
          addPendingTask(p);
          state.active = p.cat;
          if (collapsed[p.cat]) { collapsed[p.cat] = false; saveCollapsed(); }
        }
      }
    } else if (sheetCtx.mode === "create") {
      if (dueAt) {
        state.pending.push({
          text: text, tag: sheetCtx.tag || null, comment: comment || null,
          cat: cat, dueAt: dueAt, repeat: repeat, createdAt: new Date().toISOString()
        });
        if (collapsed[SCHEDULED_KEY]) { collapsed[SCHEDULED_KEY] = false; saveCollapsed(); }
      } else {
        if (!state.tasks[cat]) state.tasks[cat] = [];
        state.tasks[cat].push({ text: text, done: false, tag: sheetCtx.tag || null, comment: comment || null, createdAt: new Date().toISOString(), completedAt: null });
        if (collapsed[cat]) { collapsed[cat] = false; saveCollapsed(); }
      }
      state.active = cat;
    } else {
      // edit: task may move to a different category
      const from = sheetCtx.taskCat, idx = sheetCtx.taskIndex;
      const src = state.tasks[from] || [];
      const task = src[idx];
      if (task) {
        task.text = text;
        task.tag = sheetCtx.tag || null;
        task.comment = comment || null;
        if (cat !== from) {
          src.splice(idx, 1);
          if (!state.tasks[cat]) state.tasks[cat] = [];
          state.tasks[cat].push(task);
          if (collapsed[cat]) { collapsed[cat] = false; saveCollapsed(); }
        }
      }
    }
    save();
    closeSheet();
    render();
  }

  // ---- Show all / Collapse all ----
  // Both are screen-aware: on the archive screen they open and close its groups,
  // since the todos screen's categories aren't on screen to act on.
  function showAll() {
    if (screen === "archive") {
      // Opens groups top-down only while the row budget can still build them.
      // Marking all of them open would be a lie a full archive shows immediately:
      // 5000 entries is ~200 day-groups, and the ~180 past the budget would each
      // render as an open bar with nothing under it. Stopping where the budget
      // does keeps the saved state and the screen agreeing, and the rest open
      // normally once something above them is collapsed.
      const groups = archiveGroups();
      let left = ARCHIVE_ROW_BUDGET;
      let opened = 0;
      groups.forEach(function (g) {
        if (left <= 0) return;
        archiveOpen[g.key] = true;
        left -= g.items.length;
        opened++;
      });
      saveArchiveOpen();
      render();
      if (opened < groups.length) {
        showToast("Opened " + opened + " of " + groups.length + " groups — " + ARCHIVE_ROW_BUDGET + "-row limit");
      }
      return;
    }
    state.categories.forEach(function (c) { collapsed[c] = false; });
    collapsed[SCHEDULED_KEY] = false;
    saveCollapsed();
    render();
  }
  function collapseAll() {
    if (screen === "archive") {
      // Clearing the map is the cheap way to close everything, since an absent key
      // reads as collapsed — except while a search is running, where absent reads as
      // open, so those groups need an explicit false.
      archiveOpen = {};
      if (archiveQuery.trim()) {
        archiveGroups().forEach(function (g) { archiveOpen[g.key] = false; });
      }
      saveArchiveOpen();
      render();
      return;
    }
    state.categories.forEach(function (c) { collapsed[c] = true; });
    collapsed[SCHEDULED_KEY] = true;
    saveCollapsed();
    render();
  }

  // ---- JSON backup / restore ----
  // The envelope is multi-domain: one optional top-level section per data
  // domain — `state` + `archive` today; exercise / finance will add their own
  // (see CLAUDE.md "Future screens"). Restore is section-scoped: only domains
  // present in the file are replaced, so restoring an old todo-only backup can
  // never wipe another domain's data. A section that is present but malformed
  // rejects the whole file rather than being silently dropped. BACKUP_VERSION
  // marks the shape of existing sections; adding a new optional section is
  // deliberately not a version bump.
  const BACKUP_VERSION = 1;

  // One entry per domain: `current` feeds the export payload, `normalize`
  // validates/repairs an incoming section (null = invalid), `apply` swaps it
  // in and persists it, `describe` summarizes the replacement for the
  // restore-confirm prompt.
  const BACKUP_DOMAINS = [
    {
      key: "state",
      current: function () { return state; },
      normalize: normalizeState,
      apply: function (st) { state = st; save(); },
      describe: function (st) {
        let n = 0;
        st.categories.forEach(function (c) { n += (st.tasks[c] || []).length; });
        return "tasks: " + countAllTasks() + " → " + n +
          " (in " + st.categories.length + " categories)";
      }
    },
    {
      key: "archive",
      current: function () { return archive; },
      normalize: function (a) { return Array.isArray(a) ? a : null; },
      apply: function (a) { archive = a; saveArchive(); },
      describe: function (a) {
        return "archived history: " + archive.length + " → " + a.length + " entries";
      }
    }
  ];

  function buildBackupPayload() {
    const payload = {
      app: "todo",
      version: BACKUP_VERSION,
      exportedAt: new Date().toISOString()
    };
    BACKUP_DOMAINS.forEach(function (d) { payload[d.key] = d.current(); });
    return payload;
  }

  function exportJson() {
    const json = JSON.stringify(buildBackupPayload(), null, 2);
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const d = new Date();
    const stamp = d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");
    const a = document.createElement("a");
    a.href = url; a.download = "todos-backup-" + stamp + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    showToast("Exported backup \u2014 save it somewhere safe");
  }

  // Validates/repairs an incoming `state` section. Null means invalid.
  function normalizeState(st) {
    if (!st || !Array.isArray(st.categories) || typeof st.tasks !== "object" || !st.tasks) return null;
    // sanity-check that every category has a task array
    for (let i = 0; i < st.categories.length; i++) {
      const c = st.categories[i];
      if (!Array.isArray(st.tasks[c])) st.tasks[c] = [];
    }
    if (st.categories.length === 0) return null;
    if (!st.active || st.categories.indexOf(st.active) === -1) st.active = st.categories[0];
    if (!st.categoryTags || typeof st.categoryTags !== "object") st.categoryTags = {};
    if (!st.categoryArchived || typeof st.categoryArchived !== "object") st.categoryArchived = {};
    if (!Array.isArray(st.pending)) st.pending = [];
    return st;
  }

  // Returns the restorable sections as [{ domain, value }], or null if the
  // file is invalid or holds nothing this version knows how to restore.
  // Accepts the envelope, or (back-compat) a bare state object as the file.
  function parseBackup(text) {
    let data;
    try { data = JSON.parse(text); } catch (e) { return null; }
    if (!data || typeof data !== "object") return null;
    if (data.state === undefined && Array.isArray(data.categories)) data = { state: data };
    const sections = [];
    for (let i = 0; i < BACKUP_DOMAINS.length; i++) {
      const d = BACKUP_DOMAINS[i];
      if (data[d.key] === undefined || data[d.key] === null) continue;
      const val = d.normalize(data[d.key]);
      if (val === null) return null; // present but malformed: reject the file
      sections.push({ domain: d, value: val });
    }
    if (sections.length === 0) return null;
    return sections;
  }

  function applyBackup(sections) {
    sections.forEach(function (s) { s.domain.apply(s.value); });
  }

  function importJson() { fileInput.click(); }
  fileInput.addEventListener("change", function (e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () {
      const sections = parseBackup(reader.result);
      fileInput.value = "";
      if (!sections) { showToast("That file isn't a valid backup"); return; }
      const lines = sections.map(function (s) { return "• " + s.domain.describe(s.value); });
      if (!confirm("Restore this backup? It replaces:\n" + lines.join("\n") +
          "\nAnything not in the file is left untouched.")) return;
      applyBackup(sections);
      // A restored backup can carry scheduled tasks that came due while it sat in
      // the file — sweep before rendering so they land in the list, not the future.
      promotePending();
      render();
      showToast("Backup restored");
    };
    reader.readAsText(file);
  });

  function countAllTasks() {
    let n = 0;
    state.categories.forEach(function (c) { n += (state.tasks[c] || []).length; });
    return n;
  }

  // Moves a single category's completed tasks out of state.tasks into the archive (rather
  // than deleting them), leaving undone tasks in place. Shared by archiveDone (sweeps every
  // category) and archiveCategory (sweeps one, after confirming nothing undone remains).
  function sweepDoneTasks(cat) {
    const tasks = state.tasks[cat] || [];
    const remaining = [];
    let archived = 0;
    const now = new Date().toISOString();
    tasks.forEach(function (t) {
      if (t.done) {
        archive.push({
          text: t.text,
          tag: t.tag || null,
          // Carried through the sweep so the archive screen can show it. Comments
          // shipped after archiving did, so entries written before this simply have
          // no field — the viewer skips the line rather than needing a migration.
          comment: t.comment || null,
          category: cat,
          createdAt: t.createdAt || null,
          completedAt: t.completedAt || now,
          archivedAt: now
        });
        archived++;
      } else {
        remaining.push(t);
      }
    });
    state.tasks[cat] = remaining;
    return archived;
  }

  // Single-page view has no active category, so this sweeps completed tasks across all categories.
  function archiveDone() {
    let archived = 0;
    state.categories.forEach(function (cat) { archived += sweepDoneTasks(cat); });
    save();
    if (archived) saveArchive();
    render();
    showToast(archived ? "Archived " + archived + " completed task" + (archived === 1 ? "" : "s") : "Nothing to archive");
    if (archived) checkArchiveThreshold();
  }

  // Once the archive crosses ARCHIVE_THRESHOLD, prompt to export a full backup (which
  // includes the archive) and then trim it back down to the most recent half.
  function checkArchiveThreshold() {
    if (archive.length < ARCHIVE_THRESHOLD) return;
    const keep = Math.floor(ARCHIVE_THRESHOLD / 2);
    const doExport = confirm(
      "Archive has grown to " + archive.length + " tasks. Export a full backup now, then trim the archive down to the most recent " + keep + "?"
    );
    if (!doExport) return;
    exportJson();
    trimArchive(keep);
  }

  function trimArchive(keep) {
    archive.sort(function (a, b) { return (a.archivedAt || "").localeCompare(b.archivedAt || ""); });
    const removed = archive.length - keep;
    if (removed > 0) archive.splice(0, removed);
    saveArchive();
    showToast("Trimmed archive to the most recent " + archive.length + " tasks");
  }

  sheetSave.onclick = saveSheet;
  sheetDelete.onclick = deleteFromSheet;
  sheetBackdrop.onclick = closeSheet;
  sheetText.addEventListener("input", updateSaveEnabled);
  sheetText.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !sheetSave.disabled) saveSheet();
  });
  // Comment is a textarea, so Enter would normally insert a newline — preventDefault
  // to save instead, matching Task's behavior, at the cost of no multi-line entry.
  sheetComment.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !sheetSave.disabled) {
      e.preventDefault();
      saveSheet();
    }
  });
  // Clearing the field leaves Later selected with no date, which just disables
  // Save — better than silently reverting the sheet to "Now" mid-edit.
  sheetWhenInput.addEventListener("change", function () {
    if (!sheetCtx) return;
    sheetCtx.when = fromLocalInput(sheetWhenInput.value);
    // Weekly/Monthly name their anchor after this date, so the chips restate
    // themselves when it moves — "Weekly (Mon)" becomes "Weekly (Thu)".
    if (sheetCtx.later) renderSheetRepeatChips();
    updateSaveEnabled();
  });
  // A plain date, stored as typed ("YYYY-MM-DD") rather than as an instant: it's a
  // calendar boundary, not a moment, and it reads back that way in an export.
  sheetUntilInput.addEventListener("change", function () {
    if (!sheetCtx) return;
    sheetCtx.until = sheetUntilInput.value || null;
    updateSaveEnabled();
  });

  // ---- Hamburger menu ----
  const menuBtn = document.getElementById("menu-btn");
  const menu = document.getElementById("menu");
  const menuBackdrop = document.getElementById("menu-backdrop");

  function openMenu() {
    menu.classList.add("open");
    menuBackdrop.classList.add("open");
    menuBtn.setAttribute("aria-expanded", "true");
  }
  function closeMenu() {
    menu.classList.remove("open");
    menuBackdrop.classList.remove("open");
    menuBtn.setAttribute("aria-expanded", "false");
  }
  function toggleMenu() {
    if (menu.classList.contains("open")) closeMenu(); else openMenu();
  }
  // Run a menu action, then close the menu. importJson opens a file picker,
  // which is fine to fire after closing.
  function menuAction(fn) {
    return function () { closeMenu(); fn(); };
  }

  menuBtn.onclick = toggleMenu;
  menuBackdrop.onclick = closeMenu;

  document.getElementById("show-all-btn").onclick = menuAction(showAll);
  document.getElementById("collapse-all-btn").onclick = menuAction(collapseAll);
  document.getElementById("organize-cats-btn").onclick = menuAction(openCatSheet);
  document.getElementById("export-btn").onclick = menuAction(exportJson);
  document.getElementById("import-btn").onclick = menuAction(importJson);
  document.getElementById("archive-done-btn").onclick = menuAction(archiveDone);
  document.getElementById("about-btn").onclick = menuAction(openAboutSheet);

  // Organize-categories sheet controls
  catDoneBtn.onclick = closeCatSheet;
  catBackdrop.onclick = closeCatSheet;

  // About sheet controls
  aboutDoneBtn.onclick = closeAboutSheet;
  aboutBackdrop.onclick = closeAboutSheet;

  // Category edit sheet controls
  // Wrapped rather than assigned directly so commitCategoryEditName()'s boolean
  // isn't handed to the event system as a handler return value.
  catEditName.onblur = function () { commitCategoryEditName(); };
  // Enter — iOS's blue Done key — takes the same path as the Save button, so the sheet
  // closes on it exactly like the task sheet's Task field does. It used to only blur,
  // which committed the name but left the sheet sitting open with nothing else to do.
  catEditName.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); saveCategorySheet(); }
  });
  // Closes the sheet on move (rather than re-rendering in place, like the other
  // fields) so the reordering is visible on the main screen right away.
  catEditMoveUp.onclick = function () { moveCategoryUp(catEditCat); closeCategoryEditSheet(); };
  catEditMoveDown.onclick = function () { moveCategoryDown(catEditCat); closeCategoryEditSheet(); };
  catEditMoveTop.onclick = function () { moveCategoryToTop(catEditCat); closeCategoryEditSheet(); };
  // Closes on click regardless of outcome — the toast sits behind the sheet
  // (z-index), so leaving it open on failure would hide the error message.
  catEditArchiveBtn.onclick = function () {
    const cat = catEditCat;
    const res = archiveCategory(cat);
    closeCategoryEditSheet();
    showToast(res === true ? '"' + cat + '" archived' : res);
  };
  catEditDeleteBtn.onclick = function () {
    if (confirmAndDeleteCategory(catEditCat)) closeCategoryEditSheet();
  };
  catEditSaveBtn.onclick = saveCategorySheet;
  catEditBackdrop.onclick = closeCategoryEditSheet;

  // An iOS PWA is usually resumed, not launched — it can sit suspended for days —
  // so due scheduled tasks are swept in on the way back to the foreground as well
  // as at startup. The startup sweep runs before the first render, so its results
  // are simply part of the list that appears.
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && promoteAndReport()) render();
  });

  // Catches the case where a restored backup already carries an over-threshold archive.
  checkArchiveThreshold();
  promoteAndReport();
  buildNav();
  render();
</script>
</body>
</html>
