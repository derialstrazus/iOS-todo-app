<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Todo">
<meta name="theme-color" content="#0d0a06" id="theme-color">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Todo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  /* ------------------------------------------------------------------
     Palette. Two modes: default/Home is warm gold, Work is cold steel.
     `data-mode` is stamped on <html> from viewMode, so clearing the mode
     falls back to gold. Legacy token names (--bg, --surface, --accent …)
     are kept as aliases so rules that haven't been restyled still resolve.
     ------------------------------------------------------------------ */
  :root {
    --acc: #d9a441;
    --acc-hi: #f5c869;
    --acc-dim: #7a5f2c;
    --acc-wash: rgba(217,164,65,0.10);
    --acc-glow: rgba(217,164,65,0.45);
    --on-acc: #1d1408;

    --bg-a: #171006;
    --bg-b: #0d0a06;
    --bg-c: #060504;
    --sky: rgba(245,200,105,0.20);
    --ray: rgba(245,225,180,0.045);

    --pan-a: #241b0d;
    --pan-b: #1a1409;

    --ink: #ece0c6;
    --ink-2: #93825f;

    --edge: #3a2c14;
    --hatch: rgba(217,164,65,0.05);
    --row-line: rgba(217,164,65,0.13);

    --tab-a: #312613;
    --tab-b: #1e1709;

    --bar-a: rgba(72,55,25,0.85);
    --bar-b: rgba(48,37,17,0.92);
    --bar-line: rgba(217,164,65,0.26);

    --alert: #c9552f;

    /* Category tags carry the two mode hues as FIXED values — deliberately not
       remapped under [data-mode], so a Home-tagged category reads gold and a
       Work-tagged one reads steel whichever mode is currently active. */
    --home: #d9a441;
    --work: #a9bdcc;

    /* legacy aliases */
    --bg: var(--bg-b);
    --surface: #1c1509;
    --surface-2: var(--pan-a);
    --text: var(--ink);
    --muted: var(--ink-2);
    --accent: var(--acc);
    --danger: var(--alert);
  }

  :root[data-mode="work"] {
    --acc: #a9bdcc;
    --acc-hi: #e0edf5;
    --acc-dim: #4e606d;
    --acc-wash: rgba(169,189,204,0.12);
    --acc-glow: rgba(169,189,204,0.40);
    --on-acc: #0b1116;

    --bg-a: #0e1215;
    --bg-b: #090c0f;
    --bg-c: #050708;
    --sky: rgba(210,228,240,0.12);
    --ray: rgba(225,238,248,0.05);

    --pan-a: #1b2127;
    --pan-b: #141920;

    --ink: #e0e8ee;
    --ink-2: #7e8c96;

    --edge: #2c353d;
    --hatch: rgba(169,189,204,0.045);
    --row-line: rgba(169,189,204,0.13);

    --tab-a: #232b33;
    --tab-b: #151a20;

    --bar-a: rgba(48,58,68,0.85);
    --bar-b: rgba(32,40,48,0.92);
    --bar-line: rgba(169,189,204,0.24);

    /* warmer red would fight the cold ground; lift it toward coral */
    --alert: #e0765a;

    --surface: #12171c;
  }

  html, body {
    background: var(--bg-b);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    height: 100%;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    height: 100%;
    background:
      radial-gradient(ellipse 120% 55% at 78% -6%, var(--sky), transparent 62%),
      linear-gradient(196deg, var(--bg-a) 0%, var(--bg-b) 46%, var(--bg-c) 100%);
  }
  /* god-rays, fixed so they don't scroll with the list */
  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 0;
    background: repeating-linear-gradient(74deg,
      transparent 0 38px, var(--ray) 38px 40px, transparent 40px 96px);
    mix-blend-mode: screen;
  }

  /* Top controls: square notched tiles, icon only.
     The notch is a true 45° cut at top-right and bottom-left — equal offset
     on both axes — matching the augmentation tiles in Deus Ex: HR. */
  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 12px 18px 8px;
    position: relative;
    z-index: 1;
  }
  .ctrl {
    width: 38px; height: 38px;
    flex-shrink: 0;
    border: none;
    background: linear-gradient(180deg, var(--tab-a), var(--tab-b));
    color: var(--ink-2);
    display: flex; align-items: center; justify-content: center;
    clip-path: polygon(
      0 0,
      calc(100% - 10px) 0,
      100% 10px,
      100% 100%,
      10px 100%,
      0 calc(100% - 10px)
    );
  }
  .ctrl svg { width: 18px; height: 18px; display: block; }
  .ctrl:active { filter: brightness(1.35); }
  /* Active mode fills solid; drop-shadow rather than box-shadow so the glow
     follows the notched outline instead of being clipped away. */
  .mode-btn.active {
    color: var(--on-acc);
    background: linear-gradient(180deg, var(--acc-hi), var(--acc));
    filter: drop-shadow(0 0 7px var(--acc-glow));
  }

  /* Floating add button — same notch rule, scaled up (25% of the edge) */
  .fab {
    position: fixed;
    right: calc(20px + env(safe-area-inset-right));
    bottom: calc(24px + env(safe-area-inset-bottom));
    width: 54px; height: 54px;
    background: linear-gradient(180deg, var(--acc-hi), var(--acc));
    border: none;
    color: var(--on-acc);
    display: flex; align-items: center; justify-content: center;
    clip-path: polygon(
      0 0,
      calc(100% - 13px) 0,
      100% 13px,
      100% 100%,
      13px 100%,
      0 calc(100% - 13px)
    );
    filter: drop-shadow(0 3px 14px var(--acc-glow));
    z-index: 40;
  }
  .fab svg { width: 22px; height: 22px; display: block; }
  .fab:active { transform: scale(0.94); }

  /* Bottom-sheet menu (create / edit) */
  .sheet-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 60;
  }
  .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--surface);
    border-top: 1px solid var(--bar-line);
    padding: 8px 18px calc(20px + env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    z-index: 61;
    max-height: 88%;
    overflow-y: auto;
  }
  .sheet.open { transform: translateY(0); }
  .sheet-grip {
    width: 34px; height: 3px;
    background: var(--acc-dim);
    margin: 7px auto 15px;
  }
  .field { margin-bottom: 16px; }
  /* Field labels borrow the category bar: filled strip, hairline, gold tick,
     rounded right cap. inline-flex so the bar hugs its text like a tab. */
  .field-label {
    display: inline-flex;
    align-items: center;
    height: 23px;
    padding: 0 12px 0 7px;
    margin-bottom: 9px;
    background: linear-gradient(90deg, var(--bar-a), var(--bar-b));
    border: 1px solid var(--bar-line);
    border-left: 2px solid var(--acc);
    border-radius: 0 12px 12px 0;
    font-size: 10.5px; font-weight: 600;
    color: var(--ink);
    text-transform: uppercase;
    letter-spacing: 0.19em;
  }
  .sheet input[type="text"] {
    width: 100%;
    background: linear-gradient(180deg, var(--pan-a), var(--pan-b));
    border: 1px solid var(--row-line);
    padding: 13px 14px;
    color: var(--text);
    font-size: 16px;
    outline: none;
  }
  .sheet input[type="text"]:focus { border-color: var(--acc); }

  /* Chip rows for category + tag pickers */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: linear-gradient(180deg, var(--pan-a), var(--pan-b));
    border: 1px solid var(--row-line);
    padding: 9px 13px;
    color: var(--text);
    font-size: 13px; font-weight: 500;
    letter-spacing: 0.06em;
    display: flex; align-items: center; gap: 6px;
  }
  .chip:active { opacity: 0.75; }
  .chip.selected {
    border-color: var(--acc);
    background: var(--acc-wash);
    color: var(--acc);
  }
  .chip.chip-add { color: var(--acc); border-style: dashed; font-weight: 600; }

  /* Organize sheet stacks above the create/edit sheet when opened from its chip */
  #cat-backdrop { z-index: 80; }
  #cat-sheet { z-index: 81; }

  .sheet-actions { display: flex; gap: 10px; margin-top: 22px; }

  /* Organize-categories sheet rows */
  #cat-list { display: flex; flex-direction: column; gap: 3px; }
  .cat-row {
    display: flex;
    align-items: center;
    gap: 9px;
    background:
      repeating-linear-gradient(45deg, var(--hatch) 0 3px, transparent 3px 7px),
      linear-gradient(180deg, var(--pan-a), var(--pan-b));
    border-bottom: 1px solid var(--row-line);
    padding: 6px 10px;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  .cat-row.dragging { opacity: 0.5; }
  .cat-row.drag-over { transform: translateY(2px); box-shadow: 0 0 0 2px var(--acc); }
  .cat-row .handle { color: var(--ink-2); font-size: 15px; touch-action: none; padding: 4px 2px; line-height: 1; opacity: 0.65; }
  .cat-row input.cat-name {
    flex: 1;
    min-width: 0;
    background: none;
    border: 1px solid transparent;
    padding: 7px 6px;
    color: var(--text);
    font-size: 16px;
    outline: none;
  }
  .cat-row input.cat-name:focus { border-color: var(--acc); background: var(--bg-c); }
  .cat-row .cat-del {
    color: var(--danger);
    background: none; border: none;
    font-size: 18px; padding: 4px 8px;
    opacity: 0.7; flex-shrink: 0;
  }
  .cat-row .cat-del:active { opacity: 1; }
  .cat-tag-btn {
    flex-shrink: 0;
    width: 30px; height: 30px;
    border: none;
    border-radius: 50%;
    background: var(--surface);
    color: var(--muted);
    font-size: 15px;
    display: flex; align-items: center; justify-content: center;
  }
  .cat-tag-btn.tag-home { background: rgba(217,164,65,0.18); color: var(--home); }
  .cat-tag-btn.tag-work { background: rgba(169,189,204,0.18); color: var(--work); }
  .cat-tag-btn:active { opacity: 0.75; }
  .cat-add-row { display: flex; gap: 10px; margin-top: 14px; }
  .cat-add-row input {
    flex: 1; min-width: 0;
    background: linear-gradient(180deg, var(--pan-a), var(--pan-b));
    border: 1px solid var(--row-line);
    padding: 13px 14px;
    color: var(--text);
    font-size: 16px;
    outline: none;
  }
  .cat-add-row input:focus { border-color: var(--acc); }
  .cat-add-btn { flex: 0 0 auto; padding: 14px 20px; }
  /* Action buttons carry the same opposing 45° notch as the FAB and the top
     tiles — the shape is reserved for things you press. No border: clip-path
     cuts it away on the diagonals. */
  .sheet-btn {
    flex: 1;
    border: none;
    padding: 15px;
    font-size: 13px; font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    clip-path: polygon(
      0 0,
      calc(100% - 12px) 0,
      100% 12px,
      100% 100%,
      12px 100%,
      0 calc(100% - 12px)
    );
  }
  .sheet-btn.primary {
    background: linear-gradient(180deg, var(--acc-hi), var(--acc));
    color: var(--on-acc);
  }
  .sheet-btn.primary:disabled { opacity: 0.35; }
  .sheet-btn.secondary {
    background: linear-gradient(180deg, var(--tab-a), var(--tab-b));
    color: var(--ink);
  }
  .sheet-btn:active { filter: brightness(1.2); }
  /* Text-only, so a notch would have no fill to cut */
  .sheet-btn.danger {
    background: none; color: var(--danger);
    flex: 0 0 auto; padding: 15px 16px;
    clip-path: none;
  }

  /* Hamburger dropdown menu */
  .menu-btn { margin-left: auto; }
  .menu-backdrop {
    position: fixed; inset: 0;
    background: transparent;
    opacity: 0; pointer-events: none;
    z-index: 70;
  }
  .menu-backdrop.open { opacity: 1; pointer-events: auto; }
  .menu {
    position: fixed;
    top: calc(58px + env(safe-area-inset-top));
    right: calc(20px + env(safe-area-inset-right));
    background: var(--surface);
    border: 1px solid var(--bar-line);
    padding: 5px;
    min-width: 196px;
    box-shadow: 0 10px 34px rgba(0,0,0,0.5);
    opacity: 0;
    transform: translateY(-6px) scale(0.98);
    transform-origin: top right;
    pointer-events: none;
    transition: opacity 0.15s ease, transform 0.15s ease;
    z-index: 71;
  }
  .menu.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  .menu-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-left: 2px solid transparent;
    color: var(--text);
    font-size: 13px;
    letter-spacing: 0.08em;
    padding: 11px 13px;
  }
  .menu-item:active { background: var(--acc-wash); border-left-color: var(--acc); }
  .menu-item.danger { color: var(--danger); }
  .menu-sep { height: 1px; background: var(--row-line); margin: 4px 6px; }

  /* Scroll region holding all category sections */
  .scroll {
    flex: 1; overflow-y: auto;
    padding: 4px 18px calc(96px + env(safe-area-inset-bottom));
    -webkit-overflow-scrolling: touch;
    position: relative;
    z-index: 1;
  }

  .section { margin-bottom: 12px; }

  /* Category bar. Deliberately LIGHTER than the ground rather than darker:
     the list scrolls, so contrast can't depend on where the bar happens to
     sit against the background gradient. The left tick carries the category's
     home/work tag, or the mode accent when untagged. */
  .sec-head {
    display: flex;
    align-items: center;
    gap: 9px;
    height: 30px;
    padding: 0 4px 0 6px;
    background: linear-gradient(90deg, var(--bar-a), var(--bar-b));
    border: 1px solid var(--bar-line);
    border-left: 2px solid var(--acc);
    border-radius: 0 15px 15px 0;
    cursor: pointer;
    user-select: none;
  }
  .section.tag-home .sec-head { border-left-color: var(--home); }
  .section.tag-work .sec-head { border-left-color: var(--work); }
  .sec-caret {
    color: var(--acc);
    width: 14px; height: 14px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s ease;
  }
  .section.tag-home .sec-caret { color: var(--home); }
  .section.tag-work .sec-caret { color: var(--work); }
  .sec-caret svg { width: 9px; height: 9px; display: block; }
  .section.collapsed .sec-caret { transform: rotate(-90deg); }
  .sec-title {
    flex: 1;
    text-align: right;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.19em;
    text-transform: uppercase;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sec-add {
    flex-shrink: 0;
    width: 22px; height: 22px;
    border: 1px solid var(--acc-dim);
    border-radius: 50%;
    background: var(--acc-wash);
    color: var(--acc);
    display: flex; align-items: center; justify-content: center;
  }
  .sec-add svg { width: 11px; height: 11px; display: block; }
  .sec-add:active { background: var(--acc); color: var(--on-acc); }
  .sec-body { margin-top: 5px; }
  .section.collapsed .sec-body { display: none; }

  /* Task row: square-cornered slab with a 45° hatch, tightened to a ~37px
     pitch. No selection state — this is a touch app, nothing is "focused". */
  li {
    display: flex;
    align-items: center;
    gap: 9px;
    min-height: 34px;
    padding: 5px 11px;
    margin-bottom: 3px;
    list-style: none;
    background:
      repeating-linear-gradient(45deg, var(--hatch) 0 3px, transparent 3px 7px),
      linear-gradient(180deg, var(--pan-a), var(--pan-b));
    border-bottom: 1px solid var(--row-line);
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  li.dragging { opacity: 0.5; }
  li.drag-over { transform: translateY(2px); box-shadow: 0 0 0 2px var(--acc); }
  .handle {
    color: var(--ink-2);
    font-size: 15px;
    cursor: grab;
    touch-action: none;
    padding: 4px 2px;
    line-height: 1;
    opacity: 0.65;
    flex-shrink: 0;
  }
  /* Square check. Visually 17px but padded out to a comfortable tap target. */
  .check {
    width: 17px; height: 17px;
    border: 1px solid var(--acc-dim);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, border-color 0.15s;
  }
  li.done .check { background: var(--acc-dim); border-color: var(--acc-dim); }
  li.done .check::after {
    content: "\2713";
    color: var(--bg-c);
    font-size: 11px;
    line-height: 1;
    font-weight: 700;
  }
  .label { flex: 1; font-size: 14px; line-height: 1.3; word-break: break-word; cursor: pointer; }
  li.done .label { color: var(--ink-2); text-decoration: line-through; text-decoration-color: var(--acc-dim); }

  /* Tag: dog-eared badge, bottom-right corner clipped — the counter tab that
     hangs off the augmentation tiles. */
  .tag-icon {
    flex-shrink: 0;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    line-height: 1;
    padding: 3px 6px;
    color: var(--on-acc);
    background: var(--acc);
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%);
  }
  .tag-priority { background: var(--alert); color: #1a0703; }
  .tag-pending { background: var(--acc-dim); color: var(--bg-c); }
  .tag-quick { background: var(--acc); color: var(--on-acc); }
  li.done .tag-icon { opacity: 0.4; }

  .sec-empty {
    color: var(--ink-2);
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 6px 4px 8px;
  }
  .empty-all { text-align: center; color: var(--ink-2); margin-top: 60px; font-size: 15px; line-height: 1.5; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(20px);
    background: linear-gradient(180deg, var(--tab-a), var(--tab-b));
    border: 1px solid var(--bar-line);
    color: var(--text);
    padding: 11px 18px;
    font-size: 13px;
    letter-spacing: 0.06em;
    opacity: 0; pointer-events: none;
    transition: all 0.25s;
    box-shadow: 0 6px 24px rgba(0,0,0,0.4);
    max-width: 80%; text-align: center;
    z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #file-input { display: none; }
</style>
</head>
<body>
  <div class="controls">
    <button class="ctrl mode-btn mode-home" id="home-mode-btn" aria-label="Home mode" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7v9h-6v-6h-6v6H3z"/></svg>
    </button>
    <button class="ctrl mode-btn mode-work" id="work-mode-btn" aria-label="Work mode" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13"/><path d="M9 7V4h6v3"/><path d="M3 12h18"/></svg>
    </button>
    <button class="ctrl menu-btn" id="menu-btn" aria-label="Menu" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>

  <input type="file" id="file-input" accept=".json,application/json">

  <div class="menu-backdrop" id="menu-backdrop"></div>
  <div class="menu" id="menu" role="menu">
    <button class="menu-item" id="show-all-btn" role="menuitem">Show all</button>
    <button class="menu-item" id="collapse-all-btn" role="menuitem">Collapse all</button>
    <div class="menu-sep"></div>
    <button class="menu-item" id="organize-cats-btn" role="menuitem">☰ Organize categories</button>
    <div class="menu-sep"></div>
    <button class="menu-item" id="export-btn" role="menuitem">↓ Export backup</button>
    <button class="menu-item" id="import-btn" role="menuitem">↑ Restore backup</button>
    <div class="menu-sep"></div>
    <button class="menu-item" id="archive-done-btn" role="menuitem">🗄 Archive done</button>
  </div>

  <div class="scroll" id="scroll"></div>

  <button class="fab" id="fab" aria-label="Add task">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-grip"></div>

    <div class="field">
      <label class="field-label" for="sheet-text">Task</label>
      <input id="sheet-text" type="text" placeholder="What needs doing?" autocomplete="off" enterkeyhint="done">
    </div>

    <div class="field" id="sheet-cat-field">
      <span class="field-label">Category</span>
      <div class="chips" id="sheet-cats"></div>
    </div>

    <div class="field">
      <span class="field-label">Tag (optional)</span>
      <div class="chips" id="sheet-tags"></div>
    </div>

    <div class="sheet-actions">
      <button class="sheet-btn primary" id="sheet-save" disabled>Add task</button>
      <button class="sheet-btn secondary" id="sheet-cancel">Cancel</button>
      <button class="sheet-btn danger" id="sheet-delete" style="display:none;">Delete</button>
    </div>
  </div>

  <div class="sheet-backdrop" id="cat-backdrop"></div>
  <div class="sheet" id="cat-sheet" role="dialog" aria-modal="true">
    <div class="sheet-grip"></div>

    <div class="field">
      <span class="field-label">Categories</span>
      <div id="cat-list"></div>
    </div>

    <div class="cat-add-row">
      <input id="cat-new-input" type="text" placeholder="New category name" autocomplete="off" enterkeyhint="done">
      <button class="sheet-btn primary cat-add-btn" id="cat-add-btn">Add</button>
    </div>

    <div class="sheet-actions">
      <button class="sheet-btn secondary" id="cat-done-btn">Done</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  const KEY = "todos.v2";

  const scroll = document.getElementById("scroll");
  const toast = document.getElementById("toast");
  const fileInput = document.getElementById("file-input");
  const homeModeBtn = document.getElementById("home-mode-btn");
  const workModeBtn = document.getElementById("work-mode-btn");

  // FAB + bottom sheet
  const fab = document.getElementById("fab");
  const sheet = document.getElementById("sheet");
  const sheetBackdrop = document.getElementById("sheet-backdrop");
  const sheetText = document.getElementById("sheet-text");
  const sheetCatField = document.getElementById("sheet-cat-field");
  const sheetCats = document.getElementById("sheet-cats");
  const sheetTags = document.getElementById("sheet-tags");
  const sheetSave = document.getElementById("sheet-save");
  const sheetCancel = document.getElementById("sheet-cancel");
  const sheetDelete = document.getElementById("sheet-delete");

  // Organize-categories sheet
  const catSheet = document.getElementById("cat-sheet");
  const catBackdrop = document.getElementById("cat-backdrop");
  const catList = document.getElementById("cat-list");
  const catNewInput = document.getElementById("cat-new-input");
  const catAddBtn = document.getElementById("cat-add-btn");
  const catDoneBtn = document.getElementById("cat-done-btn");

  // Available tags. `short` is what shows on the task row as a dog-eared badge;
  // `label` is the full name used in the picker and for accessibility.
  const TAGS = [
    { id: "priority", label: "Priority", short: "PRIO" },
    { id: "pending", label: "Pending", short: "HOLD" },
    { id: "quick", label: "Quick", short: "QUICK" }
  ];
  function tagById(id) {
    if (!id) return null;
    for (let i = 0; i < TAGS.length; i++) { if (TAGS[i].id === id) return TAGS[i]; }
    return null;
  }

  // Category tags: "home" | "work" | null (untagged). Cycled via a badge in the organize sheet
  // and shown as a colored accent bar on the main-screen category section.
  function catTagGlyph(tag) {
    if (tag === "home") return "H";
    if (tag === "work") return "W";
    return "·";
  }

  // Transient state for whatever the sheet is currently editing/creating
  let sheetCtx = null; // { mode:'create'|'edit', cat, tag, taskCat, taskIndex }

  // State shape: { categories: ["Home", ...], active: "Home",
  //   tasks: { "Home": [ {text, done, tag, createdAt, completedAt} ] },
  //   categoryTags: { "Home": "home" | "work" } }
  // createdAt is set once at creation. completedAt is set when done becomes true and
  // cleared back to null if unchecked. Tasks created before this field existed simply
  // lack it (undefined) until next touched.
  // `active` is retained for back-compat; here it's the default category for the Add box.
  // `categoryTags` is sparse: a category with no entry is untagged.
  let state = load();

  // Per-category collapsed state, keyed by category name. Kept in localStorage; not part of the JSON backup.
  const COLLAPSE_KEY = "todos.v2.collapsed";
  let collapsed = loadCollapsed();

  // Work Mode / Home Mode: "home" | "work" | null. Purely a render-time sort + collapse
  // preset — never mutates state.categories. Kept in localStorage; not part of the JSON backup.
  const MODE_KEY = "todos.v2.mode";
  let viewMode = loadViewMode();

  // Archived (completed) tasks live in their own localStorage key, separate from `state`.
  // This keeps every routine save() (checking a box, dragging a row) cheap regardless of how
  // much history has piled up — only archiveDone()/trimArchive() touch this key. Write-only
  // for now: no in-app viewer yet (see backlog), archive contents are only inspectable via
  // JSON export, which includes them.
  const ARCHIVE_KEY = "todos.v2.archive";
  const ARCHIVE_THRESHOLD = 5000;
  let archive = loadArchive();
  function loadArchive() {
    try {
      const a = JSON.parse(localStorage.getItem(ARCHIVE_KEY));
      if (Array.isArray(a)) return a;
    } catch (e) {}
    return [];
  }
  function saveArchive() { localStorage.setItem(ARCHIVE_KEY, JSON.stringify(archive)); }

  function defaultState() {
    return { categories: ["Home"], active: "Home", tasks: { "Home": [] }, categoryTags: {} };
  }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && s.categories && s.tasks) {
        if (!s.categoryTags || typeof s.categoryTags !== "object") s.categoryTags = {};
        return s;
      }
    } catch (e) {}
    // migrate old v1 flat list if present
    try {
      const old = JSON.parse(localStorage.getItem("todos.v1"));
      if (Array.isArray(old) && old.length) {
        return { categories: ["Home"], active: "Home", tasks: { "Home": old }, categoryTags: {} };
      }
    } catch (e) {}
    return defaultState();
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

  function loadCollapsed() {
    try {
      const c = JSON.parse(localStorage.getItem(COLLAPSE_KEY));
      if (c && typeof c === "object") return c;
    } catch (e) {}
    return {};
  }
  function saveCollapsed() { localStorage.setItem(COLLAPSE_KEY, JSON.stringify(collapsed)); }

  // Guarded like the other loaders. localStorage can throw outright rather than
  // return null — opaque origins, Safari private browsing, storage disabled. An
  // unguarded throw here is especially bad: it leaves the `viewMode` binding
  // uninitialised, so every later read (including render()'s) hits the temporal
  // dead zone and throws again, blanking the whole app rather than degrading it.
  function loadViewMode() {
    try {
      const m = localStorage.getItem(MODE_KEY);
      return (m === "home" || m === "work") ? m : null;
    } catch (e) {}
    return null;
  }
  function saveViewMode() {
    if (viewMode) localStorage.setItem(MODE_KEY, viewMode);
    else localStorage.removeItem(MODE_KEY);
  }

  // Selecting a mode expands categories tagged with it and collapses categories tagged with
  // the opposite; untagged categories are left as-is. Tapping the active mode again clears it
  // and expands everything. Category order itself is never mutated (see displayCategories()).
  function setViewMode(next) {
    if (viewMode === next) {
      viewMode = null;
      state.categories.forEach(function (c) { collapsed[c] = false; });
    } else {
      viewMode = next;
      const opposite = next === "home" ? "work" : "home";
      state.categories.forEach(function (c) {
        const tag = state.categoryTags[c];
        if (tag === next) collapsed[c] = false;
        else if (tag === opposite) collapsed[c] = true;
      });
    }
    saveViewMode();
    saveCollapsed();
    render();
  }

  function displayCategories() {
    if (!viewMode) return state.categories.slice();
    const matched = [], rest = [];
    state.categories.forEach(function (c) {
      (state.categoryTags[c] === viewMode ? matched : rest).push(c);
    });
    return matched.concat(rest);
  }

  let toastTimer;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 2200);
  }

  // ---- Category operations (used by the organize-categories sheet) ----
  // Each returns true on success, or a string error message on failure.
  function createCategory(name) {
    name = (name || "").trim();
    if (!name) return "Enter a name";
    if (state.categories.indexOf(name) !== -1) return "Category already exists";
    state.categories.push(name);
    state.tasks[name] = [];
    save();
    return true;
  }

  function renameCategory(oldName, newName) {
    newName = (newName || "").trim();
    if (!newName) return "Enter a name";
    if (newName === oldName) return true;
    if (state.categories.indexOf(newName) !== -1) return "Name already exists";
    const idx = state.categories.indexOf(oldName);
    if (idx === -1) return "Category not found";
    state.categories[idx] = newName;
    state.tasks[newName] = state.tasks[oldName];
    delete state.tasks[oldName];
    if (state.categoryTags[oldName] !== undefined) { state.categoryTags[newName] = state.categoryTags[oldName]; delete state.categoryTags[oldName]; }
    if (collapsed[oldName] !== undefined) { collapsed[newName] = collapsed[oldName]; delete collapsed[oldName]; saveCollapsed(); }
    if (state.active === oldName) state.active = newName;
    save();
    return true;
  }

  function deleteCategory(cat) {
    if (state.categories.length === 1) return "Keep at least one category";
    const idx = state.categories.indexOf(cat);
    if (idx === -1) return "Category not found";
    state.categories.splice(idx, 1);
    delete state.tasks[cat];
    delete state.categoryTags[cat];
    delete collapsed[cat]; saveCollapsed();
    if (state.active === cat) state.active = state.categories[0];
    save();
    return true;
  }

  // Cycle a category's tag: none -> home -> work -> none
  function cycleCategoryTag(cat) {
    const current = state.categoryTags[cat] || null;
    const next = !current ? "home" : current === "home" ? "work" : null;
    if (next) state.categoryTags[cat] = next; else delete state.categoryTags[cat];
    save();
  }

  function moveCategory(fromIdx, toIdx) {
    if (fromIdx === toIdx) return;
    if (fromIdx < 0 || fromIdx >= state.categories.length) return;
    if (toIdx < 0 || toIdx >= state.categories.length) return;
    const moved = state.categories.splice(fromIdx, 1)[0];
    state.categories.splice(toIdx, 0, moved);
    save();
  }

  // ---- Organize-categories sheet ----
  function openCatSheet() {
    renderCatList();
    catNewInput.value = "";
    updateCatAddEnabled();
    catBackdrop.classList.add("open");
    catSheet.classList.add("open");
  }

  function updateCatAddEnabled() {
    catAddBtn.disabled = !catNewInput.value.trim();
  }
  function closeCatSheet() {
    catSheet.classList.remove("open");
    catBackdrop.classList.remove("open");
    // reflect any changes on the main list and, if the create/edit sheet is open, its chips
    render();
    if (sheetCtx) renderSheetChips();
  }

  function renderCatList() {
    catList.innerHTML = "";
    state.categories.forEach(function (cat, index) {
      const row = document.createElement("div");
      row.className = "cat-row";
      row.dataset.index = index;

      const handle = document.createElement("div");
      handle.className = "handle";
      handle.textContent = "\u2261";

      const nameInput = document.createElement("input");
      nameInput.className = "cat-name";
      nameInput.type = "text";
      nameInput.value = cat;
      nameInput.setAttribute("enterkeyhint", "done");
      // commit rename on blur or Enter
      nameInput.dataset.original = cat;
      nameInput.onblur = function () { commitRename(nameInput); };
      nameInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); nameInput.blur(); }
      });

      const curTag = state.categoryTags[cat] || null;
      const tagBtn = document.createElement("button");
      tagBtn.className = "cat-tag-btn" + (curTag ? " tag-" + curTag : "");
      tagBtn.textContent = catTagGlyph(curTag);
      tagBtn.setAttribute("aria-label", "Category tag: " + (curTag || "none") + ", tap to change");
      tagBtn.onclick = function () { cycleCategoryTag(cat); renderCatList(); };

      const del = document.createElement("button");
      del.className = "cat-del";
      del.textContent = "\u2715";
      del.onclick = function () { deleteFromCatSheet(cat); };

      row.append(handle, nameInput, tagBtn, del);
      attachCatDrag(row, handle, index);
      catList.appendChild(row);
    });
  }

  function commitRename(input) {
    const original = input.dataset.original;
    const next = input.value.trim();
    if (next === original) { input.value = original; return; }
    const res = renameCategory(original, next);
    if (res !== true) {
      showToast(res);
      input.value = original; // revert on failure
      return;
    }
    input.dataset.original = next;
    // re-render main view lazily on close; keep the sheet list stable otherwise
  }

  function deleteFromCatSheet(cat) {
    if (state.categories.length === 1) { showToast("Keep at least one category"); return; }
    const n = (state.tasks[cat] || []).length;
    const msg = n > 0
      ? 'Delete "' + cat + '" and its ' + n + ' task' + (n === 1 ? "" : "s") + "?"
      : 'Delete "' + cat + '"?';
    if (!confirm(msg)) return;
    const res = deleteCategory(cat);
    if (res !== true) { showToast(res); return; }
    renderCatList();
  }

  function addFromCatSheet() {
    const res = createCategory(catNewInput.value);
    if (res !== true) { showToast(res); return; }
    catNewInput.value = "";
    updateCatAddEnabled();
    renderCatList();
    catNewInput.focus();
  }

  // Drag reordering of category rows (mirrors the task drag pattern)
  let catDragIndex = null;
  function attachCatDrag(row, handle, index) {
    function siblings() {
      return Array.prototype.slice.call(catList.children).filter(function (n) { return n.classList.contains("cat-row"); });
    }
    function start() { catDragIndex = index; row.classList.add("dragging"); }
    function move(clientY) {
      if (catDragIndex === null) return;
      const items = siblings();
      let target = null;
      items.forEach(function (it) {
        const r = it.getBoundingClientRect();
        if (clientY > r.top && clientY < r.bottom) target = it;
      });
      items.forEach(function (it) { it.classList.remove("drag-over"); });
      if (target && target !== row) target.classList.add("drag-over");
    }
    function end(clientY) {
      if (catDragIndex === null) return;
      const items = siblings();
      let toIndex = catDragIndex;
      items.forEach(function (it) {
        const r = it.getBoundingClientRect();
        if (clientY > r.top && clientY < r.bottom) toIndex = parseInt(it.dataset.index, 10);
      });
      moveCategory(catDragIndex, toIndex);
      catDragIndex = null;
      renderCatList();
    }
    handle.addEventListener("touchstart", function () { start(); }, { passive: true });
    handle.addEventListener("touchmove", function (e) { e.preventDefault(); move(e.touches[0].clientY); }, { passive: false });
    handle.addEventListener("touchend", function (e) { end(e.changedTouches[0].clientY); });
    handle.addEventListener("mousedown", function (e) {
      start();
      function mm(ev) { move(ev.clientY); }
      function mu(ev) { end(ev.clientY); document.removeEventListener("mousemove", mm); document.removeEventListener("mouseup", mu); }
      document.addEventListener("mousemove", mm);
      document.addEventListener("mouseup", mu);
    });
  }

  // ---- Single-page render: one collapsible section per category ----
  function render() {
    scroll.innerHTML = "";
    homeModeBtn.classList.toggle("active", viewMode === "home");
    workModeBtn.classList.toggle("active", viewMode === "work");
    homeModeBtn.setAttribute("aria-pressed", viewMode === "home" ? "true" : "false");
    workModeBtn.setAttribute("aria-pressed", viewMode === "work" ? "true" : "false");
    // Drives the palette swap. Work mode goes cold steel; Home and "no mode"
    // both fall back to the default gold defined on :root.
    if (viewMode === "work") document.documentElement.setAttribute("data-mode", "work");
    else document.documentElement.removeAttribute("data-mode");
    const tc = document.getElementById("theme-color");
    if (tc) tc.setAttribute("content", viewMode === "work" ? "#090c0f" : "#0d0a06");

    if (state.categories.length === 0) {
      const p = document.createElement("div");
      p.className = "empty-all";
      p.innerHTML = "No categories yet.<br>Add one above.";
      scroll.appendChild(p);
      return;
    }

    displayCategories().forEach(function (cat) {
      const tasks = state.tasks[cat] || [];
      const isCollapsed = !!collapsed[cat];

      const section = document.createElement("div");
      const catTag = state.categoryTags[cat] || null;
      section.className = "section" + (isCollapsed ? " collapsed" : "") + (catTag ? " tag-" + catTag : "");

      // Header: tap to toggle collapse (category management lives in the organize sheet)
      const head = document.createElement("div");
      head.className = "sec-head";

      const caret = document.createElement("span");
      caret.className = "sec-caret";
      caret.innerHTML = '<svg viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><path d="M1 3.5h10L6 9.5z"/></svg>';

      const title = document.createElement("span");
      title.className = "sec-title";
      title.textContent = cat;

      const addBtn = document.createElement("button");
      addBtn.className = "sec-add";
      addBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
      addBtn.setAttribute("aria-label", "Add task to " + cat);
      addBtn.onclick = function (e) {
        e.stopPropagation();
        openCreate(cat);
      };

      head.append(caret, title, addBtn);

      head.onclick = function () {
        collapsed[cat] = !collapsed[cat];
        saveCollapsed();
        section.classList.toggle("collapsed");
      };

      section.appendChild(head);

      // Body
      const body = document.createElement("div");
      body.className = "sec-body";

      if (tasks.length === 0) {
        const em = document.createElement("div");
        em.className = "sec-empty";
        em.textContent = "No tasks yet.";
        body.appendChild(em);
      } else {
        tasks.forEach(function (t, i) {
          const li = document.createElement("li");
          if (t.done) li.className = "done";
          li.dataset.index = i;
          li.dataset.cat = cat;

          const handle = document.createElement("div");
          handle.className = "handle";
          handle.textContent = "\u2261";

          const check = document.createElement("div");
          check.className = "check";
          check.onclick = function () {
            tasks[i].done = !tasks[i].done;
            tasks[i].completedAt = tasks[i].done ? new Date().toISOString() : null;
            save(); render();
          };

          const label = document.createElement("div");
          label.className = "label";
          label.textContent = t.text;
          label.onclick = (function (c, idx) {
            return function () { openEdit(c, idx); };
          })(cat, i);

          li.append(handle, check, label);

          // Tag badge (display only; ordering handled in a later step)
          const tagDef = tagById(t.tag);
          if (tagDef) {
            const badge = document.createElement("span");
            badge.className = "tag-icon tag-" + tagDef.id;
            badge.textContent = tagDef.short;
            badge.setAttribute("aria-label", tagDef.label);
            badge.title = tagDef.label;
            li.appendChild(badge);
          }

          attachDrag(li, handle, cat, i);
          body.appendChild(li);
        });
      }

      section.appendChild(body);
      scroll.appendChild(section);
    });
  }

  // ---- Touch + mouse drag reordering, scoped to a single category ----
  let dragIndex = null;
  let dragCat = null;
  function attachDrag(li, handle, cat, index) {
    function siblings() {
      // Only LI nodes within the same section body as `li`
      return Array.prototype.slice.call(li.parentNode.children).filter(function (n) { return n.tagName === "LI"; });
    }
    function start() {
      dragIndex = index;
      dragCat = cat;
      li.classList.add("dragging");
    }
    function move(clientY) {
      if (dragIndex === null) return;
      const items = siblings();
      let target = null;
      items.forEach(function (it) {
        const r = it.getBoundingClientRect();
        if (clientY > r.top && clientY < r.bottom) target = it;
      });
      items.forEach(function (it) { it.classList.remove("drag-over"); });
      if (target && target !== li) target.classList.add("drag-over");
    }
    function end(clientY) {
      if (dragIndex === null) return;
      const items = siblings();
      let toIndex = dragIndex;
      items.forEach(function (it) {
        const r = it.getBoundingClientRect();
        if (clientY > r.top && clientY < r.bottom) toIndex = parseInt(it.dataset.index, 10);
      });
      const tasks = state.tasks[dragCat] || [];
      if (toIndex !== dragIndex && toIndex >= 0 && toIndex < tasks.length) {
        const moved = tasks.splice(dragIndex, 1)[0];
        tasks.splice(toIndex, 0, moved);
        save();
      }
      dragIndex = null;
      dragCat = null;
      render();
    }

    handle.addEventListener("touchstart", function (e) {
      start();
    }, { passive: true });
    handle.addEventListener("touchmove", function (e) {
      e.preventDefault();
      move(e.touches[0].clientY);
    }, { passive: false });
    handle.addEventListener("touchend", function (e) {
      end(e.changedTouches[0].clientY);
    });

    // mouse fallback for desktop testing
    handle.addEventListener("mousedown", function (e) {
      start();
      function mm(ev) { move(ev.clientY); }
      function mu(ev) { end(ev.clientY); document.removeEventListener("mousemove", mm); document.removeEventListener("mouseup", mu); }
      document.addEventListener("mousemove", mm);
      document.addEventListener("mouseup", mu);
    });
  }

  // ---- Bottom-sheet create / edit ----
  // Renders the category and tag chip pickers based on the current sheetCtx selection.
  function renderSheetChips() {
    sheetCats.innerHTML = "";
    state.categories.forEach(function (cat) {
      const chip = document.createElement("button");
      chip.className = "chip" + (sheetCtx.cat === cat ? " selected" : "");
      chip.textContent = cat;
      chip.onclick = function () { sheetCtx.cat = cat; renderSheetChips(); updateSaveEnabled(); };
      sheetCats.appendChild(chip);
    });
    // "New category" chip opens the organize sheet
    const addChip = document.createElement("button");
    addChip.className = "chip chip-add";
    addChip.textContent = "\uFF0B New category";
    addChip.onclick = function () { openCatSheet(); };
    sheetCats.appendChild(addChip);

    sheetTags.innerHTML = "";
    // "None" option first, then the three tags
    const none = document.createElement("button");
    none.className = "chip" + (!sheetCtx.tag ? " selected" : "");
    none.textContent = "None";
    none.onclick = function () { sheetCtx.tag = null; renderSheetChips(); };
    sheetTags.appendChild(none);
    TAGS.forEach(function (t) {
      const chip = document.createElement("button");
      chip.className = "chip" + (sheetCtx.tag === t.id ? " selected" : "");
      chip.textContent = t.label;
      chip.setAttribute("aria-label", t.label);
      chip.onclick = function () { sheetCtx.tag = t.id; renderSheetChips(); };
      sheetTags.appendChild(chip);
    });
  }

  function updateSaveEnabled() {
    // Require both a non-empty task and a chosen category (no default).
    const ok = sheetText.value.trim().length > 0 && !!sheetCtx && !!sheetCtx.cat;
    sheetSave.disabled = !ok;
  }

  function openSheet(ctx) {
    sheetCtx = ctx;
    sheetSave.textContent = ctx.mode === "edit" ? "Save" : "Add task";
    sheetDelete.style.display = ctx.mode === "edit" ? "" : "none";
    sheetCatField.style.display = ctx.catLocked ? "none" : "";
    sheetText.value = ctx.text || "";
    renderSheetChips();
    updateSaveEnabled();
    sheetBackdrop.classList.add("open");
    sheet.classList.add("open");
    // focus the text field once the sheet has slid up
    setTimeout(function () { sheetText.focus(); }, 260);
  }

  function closeSheet() {
    sheet.classList.remove("open");
    sheetBackdrop.classList.remove("open");
    sheetCtx = null;
  }

  function openCreate(presetCat) {
    openSheet({ mode: "create", cat: presetCat || null, tag: null, text: "", catLocked: !!presetCat });
  }

  function openEdit(cat, index) {
    const task = (state.tasks[cat] || [])[index];
    if (!task) return;
    openSheet({
      mode: "edit",
      cat: cat,
      tag: task.tag || null,
      text: task.text,
      taskCat: cat,
      taskIndex: index
    });
  }

  function deleteFromSheet() {
    if (!sheetCtx || sheetCtx.mode !== "edit") return;
    const src = state.tasks[sheetCtx.taskCat] || [];
    if (src[sheetCtx.taskIndex]) src.splice(sheetCtx.taskIndex, 1);
    save();
    closeSheet();
    render();
  }

  function saveSheet() {
    if (!sheetCtx) return;
    const text = sheetText.value.trim();
    const cat = sheetCtx.cat;
    if (!text || !cat) return;

    if (sheetCtx.mode === "create") {
      if (!state.tasks[cat]) state.tasks[cat] = [];
      state.tasks[cat].push({ text: text, done: false, tag: sheetCtx.tag || null, createdAt: new Date().toISOString(), completedAt: null });
      state.active = cat;
      if (collapsed[cat]) { collapsed[cat] = false; saveCollapsed(); }
    } else {
      // edit: task may move to a different category
      const from = sheetCtx.taskCat, idx = sheetCtx.taskIndex;
      const src = state.tasks[from] || [];
      const task = src[idx];
      if (task) {
        task.text = text;
        task.tag = sheetCtx.tag || null;
        if (cat !== from) {
          src.splice(idx, 1);
          if (!state.tasks[cat]) state.tasks[cat] = [];
          state.tasks[cat].push(task);
          if (collapsed[cat]) { collapsed[cat] = false; saveCollapsed(); }
        }
      }
    }
    save();
    closeSheet();
    render();
  }

  // ---- Show all / Collapse all ----
  function showAll() {
    state.categories.forEach(function (c) { collapsed[c] = false; });
    saveCollapsed();
    render();
  }
  function collapseAll() {
    state.categories.forEach(function (c) { collapsed[c] = true; });
    saveCollapsed();
    render();
  }

  // ---- JSON backup / restore (full-fidelity: categories, tasks, tags, and any future fields) ----
  const BACKUP_VERSION = 1;

  function exportJson() {
    const payload = {
      app: "todo",
      version: BACKUP_VERSION,
      exportedAt: new Date().toISOString(),
      state: state,
      archive: archive
    };
    const json = JSON.stringify(payload, null, 2);
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const d = new Date();
    const stamp = d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");
    const a = document.createElement("a");
    a.href = url; a.download = "todos-backup-" + stamp + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    showToast("Exported backup \u2014 save it somewhere safe");
  }

  // Accepts either a full backup envelope { state: {...} } or a bare state object.
  function parseBackup(text) {
    let data;
    try { data = JSON.parse(text); } catch (e) { return null; }
    const st = data && data.state ? data.state : data;
    if (!st || !Array.isArray(st.categories) || typeof st.tasks !== "object" || !st.tasks) return null;
    // sanity-check that every category has a task array
    for (let i = 0; i < st.categories.length; i++) {
      const c = st.categories[i];
      if (!Array.isArray(st.tasks[c])) st.tasks[c] = [];
    }
    if (st.categories.length === 0) return null;
    if (!st.active || st.categories.indexOf(st.active) === -1) st.active = st.categories[0];
    if (!st.categoryTags || typeof st.categoryTags !== "object") st.categoryTags = {};
    return st;
  }

  function importJson() { fileInput.click(); }
  fileInput.addEventListener("change", function (e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () {
      const parsed = parseBackup(reader.result);
      if (!parsed) { showToast("That file isn't a valid backup"); fileInput.value = ""; return; }
      let archiveFromBackup = null;
      try {
        const raw = JSON.parse(reader.result);
        if (Array.isArray(raw.archive)) archiveFromBackup = raw.archive;
      } catch (e) {}
      let n = 0;
      parsed.categories.forEach(function (c) { n += (parsed.tasks[c] || []).length; });
      if (!confirm("Restore this backup? It replaces your current " +
          countAllTasks() + " task(s) with " + n + " task(s).")) {
        fileInput.value = "";
        return;
      }
      state = parsed;
      if (archiveFromBackup) archive = archiveFromBackup;
      save();
      if (archiveFromBackup) saveArchive();
      render();
      showToast("Restored " + n + " task" + (n === 1 ? "" : "s") + " in " + parsed.categories.length + " categories");
      fileInput.value = "";
    };
    reader.readAsText(file);
  });

  function countAllTasks() {
    let n = 0;
    state.categories.forEach(function (c) { n += (state.tasks[c] || []).length; });
    return n;
  }

  // Moves completed tasks out of state into the archive (rather than deleting them).
  // Single-page view has no active category, so this sweeps completed tasks across all categories.
  function archiveDone() {
    let archived = 0;
    const now = new Date().toISOString();
    state.categories.forEach(function (cat) {
      const tasks = state.tasks[cat] || [];
      const remaining = [];
      tasks.forEach(function (t) {
        if (t.done) {
          archive.push({
            text: t.text,
            tag: t.tag || null,
            category: cat,
            createdAt: t.createdAt || null,
            completedAt: t.completedAt || now,
            archivedAt: now
          });
          archived++;
        } else {
          remaining.push(t);
        }
      });
      state.tasks[cat] = remaining;
    });
    save();
    if (archived) saveArchive();
    render();
    showToast(archived ? "Archived " + archived + " completed task" + (archived === 1 ? "" : "s") : "Nothing to archive");
    if (archived) checkArchiveThreshold();
  }

  // Once the archive crosses ARCHIVE_THRESHOLD, prompt to export a full backup (which
  // includes the archive) and then trim it back down to the most recent half.
  function checkArchiveThreshold() {
    if (archive.length < ARCHIVE_THRESHOLD) return;
    const keep = Math.floor(ARCHIVE_THRESHOLD / 2);
    const doExport = confirm(
      "Archive has grown to " + archive.length + " tasks. Export a full backup now, then trim the archive down to the most recent " + keep + "?"
    );
    if (!doExport) return;
    exportJson();
    trimArchive(keep);
  }

  function trimArchive(keep) {
    archive.sort(function (a, b) { return (a.archivedAt || "").localeCompare(b.archivedAt || ""); });
    const removed = archive.length - keep;
    if (removed > 0) archive.splice(0, removed);
    saveArchive();
    showToast("Trimmed archive to the most recent " + archive.length + " tasks");
  }

  fab.onclick = function () { openCreate(); };
  sheetSave.onclick = saveSheet;
  sheetCancel.onclick = closeSheet;
  sheetDelete.onclick = deleteFromSheet;
  sheetBackdrop.onclick = closeSheet;
  sheetText.addEventListener("input", updateSaveEnabled);
  sheetText.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !sheetSave.disabled) saveSheet();
  });

  // ---- Hamburger menu ----
  const menuBtn = document.getElementById("menu-btn");
  const menu = document.getElementById("menu");
  const menuBackdrop = document.getElementById("menu-backdrop");

  function openMenu() {
    menu.classList.add("open");
    menuBackdrop.classList.add("open");
    menuBtn.setAttribute("aria-expanded", "true");
  }
  function closeMenu() {
    menu.classList.remove("open");
    menuBackdrop.classList.remove("open");
    menuBtn.setAttribute("aria-expanded", "false");
  }
  function toggleMenu() {
    if (menu.classList.contains("open")) closeMenu(); else openMenu();
  }
  // Run a menu action, then close the menu. importJson opens a file picker,
  // which is fine to fire after closing.
  function menuAction(fn) {
    return function () { closeMenu(); fn(); };
  }

  menuBtn.onclick = toggleMenu;
  menuBackdrop.onclick = closeMenu;

  homeModeBtn.onclick = function () { setViewMode("home"); };
  workModeBtn.onclick = function () { setViewMode("work"); };

  document.getElementById("show-all-btn").onclick = menuAction(showAll);
  document.getElementById("collapse-all-btn").onclick = menuAction(collapseAll);
  document.getElementById("organize-cats-btn").onclick = menuAction(openCatSheet);
  document.getElementById("export-btn").onclick = menuAction(exportJson);
  document.getElementById("import-btn").onclick = menuAction(importJson);
  document.getElementById("archive-done-btn").onclick = menuAction(archiveDone);

  // Organize-categories sheet controls
  catAddBtn.onclick = addFromCatSheet;
  catNewInput.addEventListener("input", updateCatAddEnabled);
  catNewInput.addEventListener("keydown", function (e) { if (e.key === "Enter" && !catAddBtn.disabled) addFromCatSheet(); });
  catDoneBtn.onclick = closeCatSheet;
  catBackdrop.onclick = closeCatSheet;

  // Catches the case where a restored backup already carries an over-threshold archive.
  checkArchiveThreshold();
  render();
</script>
</body>
</html>
