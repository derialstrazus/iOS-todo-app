<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Todo">
<meta name="theme-color" content="#0f1115">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Todo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0f1115;
    --surface: #1a1d24;
    --surface-2: #22262f;
    --text: #e8eaed;
    --muted: #8a909c;
    --accent: #4f9cf9;
    --danger: #f96d5f;
  }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    height: 100%;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    height: 100%;
  }

  /* Top controls row: Show all / Collapse all + Add category */
  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 12px 20px 6px;
  }
  .ctrl {
    background: var(--surface);
    border: 1px solid var(--surface-2);
    border-radius: 10px;
    padding: 9px 12px;
    color: var(--text);
    font-size: 13px; font-weight: 500;
    display: flex; align-items: center; gap: 6px;
  }
  .ctrl:active { background: var(--surface-2); }

  /* Floating add button (bottom-right) */
  .fab {
    position: fixed;
    right: calc(20px + env(safe-area-inset-right));
    bottom: calc(24px + env(safe-area-inset-bottom));
    width: 58px; height: 58px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    color: #fff;
    font-size: 32px; font-weight: 300;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 20px rgba(0,0,0,0.45);
    z-index: 40;
  }
  .fab:active { transform: scale(0.94); opacity: 0.9; }

  /* Bottom-sheet menu (create / edit) */
  .sheet-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 60;
  }
  .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--surface);
    border-radius: 18px 18px 0 0;
    padding: 8px 20px calc(20px + env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    z-index: 61;
    max-height: 88%;
    overflow-y: auto;
  }
  .sheet.open { transform: translateY(0); }
  .sheet-grip {
    width: 38px; height: 4px;
    background: var(--surface-2);
    border-radius: 2px;
    margin: 8px auto 14px;
  }
  .field { margin-bottom: 16px; }
  .field-label {
    display: block;
    font-size: 12px; font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
  }
  .sheet input[type="text"] {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid transparent;
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--text);
    font-size: 16px;
    outline: none;
  }
  .sheet input[type="text"]:focus { border-color: var(--accent); }

  /* Chip rows for category + tag pickers */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: var(--surface-2);
    border: 1px solid transparent;
    border-radius: 20px;
    padding: 9px 14px;
    color: var(--text);
    font-size: 14px; font-weight: 500;
    display: flex; align-items: center; gap: 6px;
  }
  .chip:active { opacity: 0.75; }
  .chip.selected { border-color: var(--accent); background: rgba(79,156,249,0.18); color: var(--accent); }
  .chip .ic { font-size: 15px; }

  .sheet-actions { display: flex; gap: 10px; margin-top: 22px; }
  .sheet-btn {
    flex: 1;
    border: none; border-radius: 12px;
    padding: 15px;
    font-size: 15px; font-weight: 600;
  }
  .sheet-btn.primary { background: var(--accent); color: #fff; }
  .sheet-btn.primary:disabled { opacity: 0.4; }
  .sheet-btn.secondary { background: var(--surface-2); color: var(--text); }
  .sheet-btn.danger { background: none; color: var(--danger); flex: 0 0 auto; padding: 15px 18px; }

  /* Hamburger dropdown menu */
  .menu-btn { margin-left: auto; font-size: 18px; padding: 8px 13px; line-height: 1; }
  .menu-backdrop {
    position: fixed; inset: 0;
    background: transparent;
    opacity: 0; pointer-events: none;
    z-index: 70;
  }
  .menu-backdrop.open { opacity: 1; pointer-events: auto; }
  .menu {
    position: fixed;
    top: calc(58px + env(safe-area-inset-top));
    right: calc(20px + env(safe-area-inset-right));
    background: var(--surface);
    border: 1px solid var(--surface-2);
    border-radius: 14px;
    padding: 6px;
    min-width: 190px;
    box-shadow: 0 10px 34px rgba(0,0,0,0.5);
    opacity: 0;
    transform: translateY(-6px) scale(0.98);
    transform-origin: top right;
    pointer-events: none;
    transition: opacity 0.15s ease, transform 0.15s ease;
    z-index: 71;
  }
  .menu.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  .menu-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: var(--text);
    font-size: 15px;
    padding: 12px 14px;
    border-radius: 9px;
  }
  .menu-item:active { background: var(--surface-2); }
  .menu-item.danger { color: var(--danger); }
  .menu-sep { height: 1px; background: var(--surface-2); margin: 5px 8px; }

  /* Scroll region holding all category sections */
  .scroll { flex: 1; overflow-y: auto; padding: 4px 20px 24px; -webkit-overflow-scrolling: touch; }

  .section { margin-bottom: 14px; }
  .sec-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 4px;
    cursor: pointer;
    user-select: none;
  }
  .sec-caret {
    color: var(--muted);
    font-size: 13px;
    width: 14px; text-align: center;
    transition: transform 0.15s ease;
    flex-shrink: 0;
  }
  .section.collapsed .sec-caret { transform: rotate(-90deg); }
  .sec-title { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; flex: 1; }
  .sec-count {
    font-size: 12px;
    color: var(--muted);
    background: var(--surface-2);
    border-radius: 10px;
    padding: 2px 8px;
    min-width: 20px; text-align: center;
  }
  .section.collapsed .sec-body { display: none; }

  li {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 10px;
    list-style: none;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  li.dragging { opacity: 0.5; }
  li.drag-over { transform: translateY(2px); box-shadow: 0 0 0 2px var(--accent); }
  .handle {
    color: var(--muted);
    font-size: 18px;
    cursor: grab;
    touch-action: none;
    padding: 0 2px;
    line-height: 1;
  }
  .check {
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 2px solid var(--muted);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  li.done .check { background: var(--accent); border-color: var(--accent); }
  li.done .check::after { content: "\2713"; color: #fff; font-size: 14px; }
  .label { flex: 1; font-size: 16px; word-break: break-word; cursor: pointer; }
  li.done .label { color: var(--muted); text-decoration: line-through; }
  .sec-empty { color: var(--muted); font-size: 14px; padding: 4px 4px 10px; }
  .empty-all { text-align: center; color: var(--muted); margin-top: 60px; font-size: 15px; line-height: 1.5; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(20px);
    background: var(--surface-2);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 14px;
    opacity: 0; pointer-events: none;
    transition: all 0.25s;
    box-shadow: 0 6px 24px rgba(0,0,0,0.4);
    max-width: 80%; text-align: center;
    z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #file-input { display: none; }
</style>
</head>
<body>
  <div class="controls">
    <button class="ctrl" id="show-all-btn">Show all</button>
    <button class="ctrl" id="collapse-all-btn">Collapse all</button>
    <button class="ctrl menu-btn" id="menu-btn" aria-label="Menu" aria-haspopup="true" aria-expanded="false">&#9776;</button>
  </div>

  <input type="file" id="file-input" accept=".md,.markdown,.txt,text/markdown,text/plain">

  <div class="menu-backdrop" id="menu-backdrop"></div>
  <div class="menu" id="menu" role="menu">
    <button class="menu-item" id="add-cat-btn" role="menuitem">＋ Add category</button>
    <div class="menu-sep"></div>
    <button class="menu-item" id="export-btn" role="menuitem">↓ Export</button>
    <button class="menu-item" id="import-btn" role="menuitem">↑ Import</button>
    <div class="menu-sep"></div>
    <button class="menu-item danger" id="clear-done-btn" role="menuitem">✕ Clear done</button>
  </div>

  <div class="scroll" id="scroll"></div>

  <button class="fab" id="fab" aria-label="Add task">+</button>

  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-grip"></div>

    <div class="field">
      <span class="field-label">Category</span>
      <div class="chips" id="sheet-cats"></div>
    </div>

    <div class="field">
      <label class="field-label" for="sheet-text">Task</label>
      <input id="sheet-text" type="text" placeholder="What needs doing?" autocomplete="off" enterkeyhint="done">
    </div>

    <div class="field">
      <span class="field-label">Tag (optional)</span>
      <div class="chips" id="sheet-tags"></div>
    </div>

    <div class="sheet-actions">
      <button class="sheet-btn primary" id="sheet-save" disabled>Add task</button>
      <button class="sheet-btn secondary" id="sheet-cancel">Cancel</button>
      <button class="sheet-btn danger" id="sheet-delete" style="display:none;">Delete</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  const KEY = "todos.v2";
  const FILENAME = "Todos.md";

  const scroll = document.getElementById("scroll");
  const toast = document.getElementById("toast");
  const fileInput = document.getElementById("file-input");

  // FAB + bottom sheet
  const fab = document.getElementById("fab");
  const sheet = document.getElementById("sheet");
  const sheetBackdrop = document.getElementById("sheet-backdrop");
  const sheetText = document.getElementById("sheet-text");
  const sheetCats = document.getElementById("sheet-cats");
  const sheetTags = document.getElementById("sheet-tags");
  const sheetSave = document.getElementById("sheet-save");
  const sheetCancel = document.getElementById("sheet-cancel");
  const sheetDelete = document.getElementById("sheet-delete");

  // Available tags (icons rendered on tasks come in a later step; here they're selectable only)
  const TAGS = [
    { id: "priority", label: "Priority", icon: "\u2757" },
    { id: "pending", label: "Pending", icon: "\u231B" },
    { id: "quick", label: "Quick", icon: "\u26A1" }
  ];

  // Transient state for whatever the sheet is currently editing/creating
  let sheetCtx = null; // { mode:'create'|'edit', cat, tag, taskCat, taskIndex }

  // State shape: { categories: ["Home", ...], active: "Home", tasks: { "Home": [ {text, done} ] } }
  // `active` is retained for back-compat; here it's the default category for the Add box.
  let state = load();

  // Per-category collapsed state, keyed by category name. Kept in localStorage, not exported to Markdown.
  const COLLAPSE_KEY = "todos.v2.collapsed";
  let collapsed = loadCollapsed();

  function defaultState() {
    return { categories: ["Home"], active: "Home", tasks: { "Home": [] } };
  }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && s.categories && s.tasks) return s;
    } catch (e) {}
    // migrate old v1 flat list if present
    try {
      const old = JSON.parse(localStorage.getItem("todos.v1"));
      if (Array.isArray(old) && old.length) {
        return { categories: ["Home"], active: "Home", tasks: { "Home": old } };
      }
    } catch (e) {}
    return defaultState();
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

  function loadCollapsed() {
    try {
      const c = JSON.parse(localStorage.getItem(COLLAPSE_KEY));
      if (c && typeof c === "object") return c;
    } catch (e) {}
    return {};
  }
  function saveCollapsed() { localStorage.setItem(COLLAPSE_KEY, JSON.stringify(collapsed)); }

  let toastTimer;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 2200);
  }

  function addCategory() {
    const name = (prompt("New category name") || "").trim();
    if (!name) return;
    if (state.categories.indexOf(name) !== -1) { showToast("Category already exists"); return; }
    state.categories.push(name);
    state.tasks[name] = [];
    state.active = name;
    save();
    render();
  }

  function manageCat(cat) {
    const action = (prompt(
      'Category "' + cat + '"\n\nType:\n  R to rename\n  D to delete\n(Cancel to close)'
    ) || "").trim().toLowerCase();
    if (action === "r") {
      const nn = (prompt("Rename to", cat) || "").trim();
      if (!nn || nn === cat) return;
      if (state.categories.indexOf(nn) !== -1) { showToast("Name already exists"); return; }
      const idx = state.categories.indexOf(cat);
      state.categories[idx] = nn;
      state.tasks[nn] = state.tasks[cat];
      delete state.tasks[cat];
      if (collapsed[cat] !== undefined) { collapsed[nn] = collapsed[cat]; delete collapsed[cat]; saveCollapsed(); }
      if (state.active === cat) state.active = nn;
      save(); render();
    } else if (action === "d") {
      if (state.categories.length === 1) { showToast("Keep at least one category"); return; }
      if (!confirm('Delete "' + cat + '" and its tasks?')) return;
      const idx = state.categories.indexOf(cat);
      state.categories.splice(idx, 1);
      delete state.tasks[cat];
      delete collapsed[cat]; saveCollapsed();
      if (state.active === cat) state.active = state.categories[0];
      save(); render();
    }
  }

  // ---- Single-page render: one collapsible section per category ----
  function render() {
    scroll.innerHTML = "";

    if (state.categories.length === 0) {
      const p = document.createElement("div");
      p.className = "empty-all";
      p.innerHTML = "No categories yet.<br>Add one above.";
      scroll.appendChild(p);
      return;
    }

    state.categories.forEach(function (cat) {
      const tasks = state.tasks[cat] || [];
      const isCollapsed = !!collapsed[cat];

      const section = document.createElement("div");
      section.className = "section" + (isCollapsed ? " collapsed" : "");

      // Header: tap to toggle collapse, long-press to rename/delete
      const head = document.createElement("div");
      head.className = "sec-head";

      const caret = document.createElement("span");
      caret.className = "sec-caret";
      caret.textContent = "\u25BC";

      const title = document.createElement("span");
      title.className = "sec-title";
      title.textContent = cat;

      const cnt = document.createElement("span");
      cnt.className = "sec-count";
      cnt.textContent = tasks.filter(function (t) { return !t.done; }).length;

      head.append(caret, title, cnt);

      // long-press to rename/delete (replaces the old pill long-press)
      let pressTimer, longFired = false;
      head.addEventListener("touchstart", function () {
        longFired = false;
        pressTimer = setTimeout(function () { longFired = true; manageCat(cat); }, 550);
      }, { passive: true });
      head.addEventListener("touchend", function (e) {
        clearTimeout(pressTimer);
      });
      head.addEventListener("touchmove", function () { clearTimeout(pressTimer); });

      head.onclick = function () {
        if (longFired) { longFired = false; return; } // ignore the tap that ended a long-press
        collapsed[cat] = !collapsed[cat];
        saveCollapsed();
        section.classList.toggle("collapsed");
      };

      section.appendChild(head);

      // Body
      const body = document.createElement("div");
      body.className = "sec-body";

      if (tasks.length === 0) {
        const em = document.createElement("div");
        em.className = "sec-empty";
        em.textContent = "No tasks yet.";
        body.appendChild(em);
      } else {
        tasks.forEach(function (t, i) {
          const li = document.createElement("li");
          if (t.done) li.className = "done";
          li.dataset.index = i;
          li.dataset.cat = cat;

          const handle = document.createElement("div");
          handle.className = "handle";
          handle.textContent = "\u2261";

          const check = document.createElement("div");
          check.className = "check";
          check.onclick = function () { tasks[i].done = !tasks[i].done; save(); render(); };

          const label = document.createElement("div");
          label.className = "label";
          label.textContent = t.text;
          label.onclick = (function (c, idx) {
            return function () { openEdit(c, idx); };
          })(cat, i);

          li.append(handle, check, label);
          attachDrag(li, handle, cat, i);
          body.appendChild(li);
        });
      }

      section.appendChild(body);
      scroll.appendChild(section);
    });
  }

  // ---- Touch + mouse drag reordering, scoped to a single category ----
  let dragIndex = null;
  let dragCat = null;
  function attachDrag(li, handle, cat, index) {
    function siblings() {
      // Only LI nodes within the same section body as `li`
      return Array.prototype.slice.call(li.parentNode.children).filter(function (n) { return n.tagName === "LI"; });
    }
    function start() {
      dragIndex = index;
      dragCat = cat;
      li.classList.add("dragging");
    }
    function move(clientY) {
      if (dragIndex === null) return;
      const items = siblings();
      let target = null;
      items.forEach(function (it) {
        const r = it.getBoundingClientRect();
        if (clientY > r.top && clientY < r.bottom) target = it;
      });
      items.forEach(function (it) { it.classList.remove("drag-over"); });
      if (target && target !== li) target.classList.add("drag-over");
    }
    function end(clientY) {
      if (dragIndex === null) return;
      const items = siblings();
      let toIndex = dragIndex;
      items.forEach(function (it) {
        const r = it.getBoundingClientRect();
        if (clientY > r.top && clientY < r.bottom) toIndex = parseInt(it.dataset.index, 10);
      });
      const tasks = state.tasks[dragCat] || [];
      if (toIndex !== dragIndex && toIndex >= 0 && toIndex < tasks.length) {
        const moved = tasks.splice(dragIndex, 1)[0];
        tasks.splice(toIndex, 0, moved);
        save();
      }
      dragIndex = null;
      dragCat = null;
      render();
    }

    handle.addEventListener("touchstart", function (e) {
      start();
    }, { passive: true });
    handle.addEventListener("touchmove", function (e) {
      e.preventDefault();
      move(e.touches[0].clientY);
    }, { passive: false });
    handle.addEventListener("touchend", function (e) {
      end(e.changedTouches[0].clientY);
    });

    // mouse fallback for desktop testing
    handle.addEventListener("mousedown", function (e) {
      start();
      function mm(ev) { move(ev.clientY); }
      function mu(ev) { end(ev.clientY); document.removeEventListener("mousemove", mm); document.removeEventListener("mouseup", mu); }
      document.addEventListener("mousemove", mm);
      document.addEventListener("mouseup", mu);
    });
  }

  // ---- Bottom-sheet create / edit ----
  // Renders the category and tag chip pickers based on the current sheetCtx selection.
  function renderSheetChips() {
    sheetCats.innerHTML = "";
    state.categories.forEach(function (cat) {
      const chip = document.createElement("button");
      chip.className = "chip" + (sheetCtx.cat === cat ? " selected" : "");
      chip.textContent = cat;
      chip.onclick = function () { sheetCtx.cat = cat; renderSheetChips(); updateSaveEnabled(); };
      sheetCats.appendChild(chip);
    });

    sheetTags.innerHTML = "";
    // "None" option first, then the three tags
    const none = document.createElement("button");
    none.className = "chip" + (!sheetCtx.tag ? " selected" : "");
    none.textContent = "None";
    none.onclick = function () { sheetCtx.tag = null; renderSheetChips(); };
    sheetTags.appendChild(none);
    TAGS.forEach(function (t) {
      const chip = document.createElement("button");
      chip.className = "chip" + (sheetCtx.tag === t.id ? " selected" : "");
      const ic = document.createElement("span");
      ic.className = "ic";
      ic.textContent = t.icon;
      chip.appendChild(ic);
      chip.appendChild(document.createTextNode(t.label));
      chip.onclick = function () { sheetCtx.tag = t.id; renderSheetChips(); };
      sheetTags.appendChild(chip);
    });
  }

  function updateSaveEnabled() {
    // Require both a non-empty task and a chosen category (no default).
    const ok = sheetText.value.trim().length > 0 && !!sheetCtx && !!sheetCtx.cat;
    sheetSave.disabled = !ok;
  }

  function openSheet(ctx) {
    sheetCtx = ctx;
    sheetSave.textContent = ctx.mode === "edit" ? "Save" : "Add task";
    sheetDelete.style.display = ctx.mode === "edit" ? "" : "none";
    sheetText.value = ctx.text || "";
    renderSheetChips();
    updateSaveEnabled();
    sheetBackdrop.classList.add("open");
    sheet.classList.add("open");
    // focus the text field once the sheet has slid up
    setTimeout(function () { sheetText.focus(); }, 260);
  }

  function closeSheet() {
    sheet.classList.remove("open");
    sheetBackdrop.classList.remove("open");
    sheetCtx = null;
  }

  function openCreate() {
    openSheet({ mode: "create", cat: null, tag: null, text: "" });
  }

  function openEdit(cat, index) {
    const task = (state.tasks[cat] || [])[index];
    if (!task) return;
    openSheet({
      mode: "edit",
      cat: cat,
      tag: task.tag || null,
      text: task.text,
      taskCat: cat,
      taskIndex: index
    });
  }

  function deleteFromSheet() {
    if (!sheetCtx || sheetCtx.mode !== "edit") return;
    const src = state.tasks[sheetCtx.taskCat] || [];
    if (src[sheetCtx.taskIndex]) src.splice(sheetCtx.taskIndex, 1);
    save();
    closeSheet();
    render();
  }

  function saveSheet() {
    if (!sheetCtx) return;
    const text = sheetText.value.trim();
    const cat = sheetCtx.cat;
    if (!text || !cat) return;

    if (sheetCtx.mode === "create") {
      if (!state.tasks[cat]) state.tasks[cat] = [];
      state.tasks[cat].push({ text: text, done: false, tag: sheetCtx.tag || null });
      state.active = cat;
      if (collapsed[cat]) { collapsed[cat] = false; saveCollapsed(); }
    } else {
      // edit: task may move to a different category
      const from = sheetCtx.taskCat, idx = sheetCtx.taskIndex;
      const src = state.tasks[from] || [];
      const task = src[idx];
      if (task) {
        task.text = text;
        task.tag = sheetCtx.tag || null;
        if (cat !== from) {
          src.splice(idx, 1);
          if (!state.tasks[cat]) state.tasks[cat] = [];
          state.tasks[cat].push(task);
          if (collapsed[cat]) { collapsed[cat] = false; saveCollapsed(); }
        }
      }
    }
    save();
    closeSheet();
    render();
  }

  // ---- Show all / Collapse all ----
  function showAll() {
    state.categories.forEach(function (c) { collapsed[c] = false; });
    saveCollapsed();
    render();
  }
  function collapseAll() {
    state.categories.forEach(function (c) { collapsed[c] = true; });
    saveCollapsed();
    render();
  }

  // ---- Obsidian Markdown round-trip, grouped by category ----
  function toMarkdown() {
    const lines = ["# Todos", "", "*Exported " + new Date().toLocaleString() + "*", ""];
    state.categories.forEach(function (cat) {
      lines.push("## " + cat);
      lines.push("");
      (state.tasks[cat] || []).forEach(function (t) {
        lines.push("- [" + (t.done ? "x" : " ") + "] " + t.text);
      });
      lines.push("");
    });
    return lines.join("\n");
  }

  function fromMarkdown(text) {
    const taskRe = /^\s*[-*+]\s+\[( |x|X)\]\s+(.*\S)\s*$/;
    const headRe = /^##\s+(.*\S)\s*$/;
    const cats = [];
    const tasks = {};
    let current = null;
    text.split(/\r?\n/).forEach(function (line) {
      const h = line.match(headRe);
      if (h) {
        current = h[1];
        if (cats.indexOf(current) === -1) { cats.push(current); tasks[current] = []; }
        return;
      }
      const m = line.match(taskRe);
      if (m) {
        if (current === null) { current = "Home"; if (cats.indexOf(current) === -1) { cats.push(current); tasks[current] = []; } }
        tasks[current].push({ text: m[2], done: m[1].toLowerCase() === "x" });
      }
    });
    if (cats.length === 0) return null;
    return { categories: cats, active: cats[0], tasks: tasks };
  }

  function exportMd() {
    const md = toMarkdown();
    const blob = new Blob([md], { type: "text/markdown" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = FILENAME;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    showToast("Exported " + FILENAME + " \u2014 save it to your vault");
  }

  function importMd() { fileInput.click(); }
  fileInput.addEventListener("change", function (e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () {
      const parsed = fromMarkdown(reader.result);
      if (!parsed) { showToast("No tasks found in that file"); fileInput.value = ""; return; }
      state = parsed;
      save(); render();
      let n = 0;
      parsed.categories.forEach(function (c) { n += parsed.tasks[c].length; });
      showToast("Imported " + n + " task" + (n === 1 ? "" : "s") + " in " + parsed.categories.length + " categories");
      fileInput.value = "";
    };
    reader.readAsText(file);
  });

  function clearDone() {
    // Single-page view has no active category, so clear completed across all categories.
    let removed = 0;
    state.categories.forEach(function (cat) {
      const tasks = state.tasks[cat] || [];
      const before = tasks.length;
      state.tasks[cat] = tasks.filter(function (t) { return !t.done; });
      removed += before - state.tasks[cat].length;
    });
    save(); render();
    showToast(removed ? "Cleared " + removed + " completed" : "Nothing to clear");
  }

  fab.onclick = openCreate;
  sheetSave.onclick = saveSheet;
  sheetCancel.onclick = closeSheet;
  sheetDelete.onclick = deleteFromSheet;
  sheetBackdrop.onclick = closeSheet;
  sheetText.addEventListener("input", updateSaveEnabled);
  sheetText.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !sheetSave.disabled) saveSheet();
  });

  // ---- Hamburger menu ----
  const menuBtn = document.getElementById("menu-btn");
  const menu = document.getElementById("menu");
  const menuBackdrop = document.getElementById("menu-backdrop");

  function openMenu() {
    menu.classList.add("open");
    menuBackdrop.classList.add("open");
    menuBtn.setAttribute("aria-expanded", "true");
  }
  function closeMenu() {
    menu.classList.remove("open");
    menuBackdrop.classList.remove("open");
    menuBtn.setAttribute("aria-expanded", "false");
  }
  function toggleMenu() {
    if (menu.classList.contains("open")) closeMenu(); else openMenu();
  }
  // Run a menu action, then close the menu. importMd opens a file picker,
  // which is fine to fire after closing.
  function menuAction(fn) {
    return function () { closeMenu(); fn(); };
  }

  menuBtn.onclick = toggleMenu;
  menuBackdrop.onclick = closeMenu;

  document.getElementById("show-all-btn").onclick = showAll;
  document.getElementById("collapse-all-btn").onclick = collapseAll;
  document.getElementById("add-cat-btn").onclick = menuAction(addCategory);
  document.getElementById("export-btn").onclick = menuAction(exportMd);
  document.getElementById("import-btn").onclick = menuAction(importMd);
  document.getElementById("clear-done-btn").onclick = menuAction(clearDone);

  render();
</script>
</body>
</html>
